---
name: Validação

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar o catálogo e o índice
        run: python3 scripts/catalogo.py --check
      - name: Conferir os arquivos gerados do Mission Control
        run: python3 scripts/mission_control.py --check
      - name: Conferir o manifesto gerado do app vulnerável de demonstração
        run: python3 scripts/app_vulneravel.py --check
      - name: Instalar ferramentas de lint
        run: pip install ansible-core ansible-lint yamllint
      - name: Lint de YAML
        run: yamllint .
      - name: Sintaxe e lint dos playbooks
        working-directory: automacao
        run: |
          ansible-playbook --syntax-check playbooks/*.yml
          ansible-lint
