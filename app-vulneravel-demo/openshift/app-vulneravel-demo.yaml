                    header('Location: ?p=inicio');
                    exit;
                }
                if ($erro === '') {
                    $erro = 'Usuário ou senha inválidos.';
                }
            }
            $corpo = '<h1>Entrar</h1><div class="card"><form method="post">'
                . ($erro ? '<p class="erro">' . h($erro) . '</p>' : '')
