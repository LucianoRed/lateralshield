        case 'notas':
            // Criação de nota.
            if ($_SERVER['REQUEST_METHOD'] === 'POST' && isset($_POST['titulo'])) {
                $ins = banco()->prepare('INSERT INTO notas (usuario_id, titulo, corpo, privada) VALUES (?, ?, ?, ?)');
                $ins->execute([(int) $u['id'], (string) $_POST['titulo'], (string) ($_POST['corpo'] ?? ''), 1]);
