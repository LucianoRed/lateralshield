            echo layout('Notas', $corpo);
            break;

        case 'busca':
            $q = (string) ($_GET['q'] ?? '');
            $corpo = '<h1>Busca de notas</h1><div class="card"><form method="get">'
                . '<input type="hidden" name="p" value="busca">'
