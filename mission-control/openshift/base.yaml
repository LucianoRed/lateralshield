---
# Mission Control do LateralShield no OpenShift: aplicação, banco MySQL e rota.
#
# Este arquivo é a parte escrita à mão. O manifesto que se aplica é o
# mission-control.yaml, gerado por scripts/mission_control.py, que junta este
# arquivo aos ConfigMaps com a página e o código (mission-control/web/).
#
# A aplicação não precisa de build: usa a imagem UBI de PHP e lê o código de
# ConfigMaps. O usuário inicial é "admin" com a senha "redhat", e a troca da
# senha é exigida no primeiro acesso.
#
# O projeto não é criado aqui: crie-o antes, com "oc new-project lateralshield".
# Assim a instalação não exige permissão para criar namespaces.
#
# Credenciais do banco. O MySQL só aceita conexões do pod da aplicação (veja as
# NetworkPolicies no fim do arquivo). Troque a senha antes de aplicar, se quiser.
apiVersion: v1
kind: Secret
metadata:
  name: mission-control-db
  namespace: lateralshield
  labels:
    app.kubernetes.io/part-of: lateralshield-mission-control
type: Opaque
stringData:
  database-name: missioncontrol
  database-user: missioncontrol
  database-password: lateralshield-mission-control
---
# Usuário e senha iniciais da página. Só valem na primeira execução: depois
# disso a senha fica no banco, na forma de hash, e é trocada pela própria página.
apiVersion: v1
kind: Secret
metadata:
  name: mission-control-admin
  namespace: lateralshield
  labels:
    app.kubernetes.io/part-of: lateralshield-mission-control
type: Opaque
stringData:
  usuario: admin
  senha-inicial: redhat
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mission-control-mysql
  namespace: lateralshield
  labels:
    app.kubernetes.io/part-of: lateralshield-mission-control
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mission-control-mysql
  namespace: lateralshield
  labels:
    app.kubernetes.io/name: mission-control-mysql
    app.kubernetes.io/part-of: lateralshield-mission-control
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mission-control-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mission-control-mysql
        app.kubernetes.io/part-of: lateralshield-mission-control
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: registry.redhat.io/rhel9/mysql-80:latest
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mission-control-db
                  key: database-name
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mission-control-db
                  key: database-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mission-control-db
                  key: database-password
          volumeMounts:
            - name: dados
              mountPath: /var/lib/mysql/data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - MYSQL_PWD="$MYSQL_PASSWORD" mysqladmin -u "$MYSQL_USER" -h 127.0.0.1 ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: dados
          persistentVolumeClaim:
            claimName: mission-control-mysql
---
apiVersion: v1
kind: Service
metadata:
  name: mission-control-mysql
  namespace: lateralshield
  labels:
    app.kubernetes.io/part-of: lateralshield-mission-control
spec:
  selector:
    app.kubernetes.io/name: mission-control-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mission-control
  namespace: lateralshield
  labels:
    app.kubernetes.io/name: mission-control
    app.kubernetes.io/part-of: lateralshield-mission-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mission-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mission-control
        app.kubernetes.io/part-of: lateralshield-mission-control
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mission-control
          image: registry.access.redhat.com/ubi9/php-82:latest
          # Inicia o httpd e o PHP da imagem, sem etapa de build.
          args:
            - /usr/libexec/s2i/run
          ports:
            - name: http
              containerPort: 8080
          env:
            # Deixa o PHP ler as variáveis de ambiente do contêiner.
            - name: PHP_CLEAR_ENV
              value: "OFF"
            - name: DISPLAY_ERRORS
              value: "OFF"
            - name: HTTPD_START_SERVERS
              value: "2"
            - name: MC_DB_HOST
              value: mission-control-mysql
            - name: MC_DB_PORT
              value: "3306"
            - name: MC_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mission-control-db
                  key: database-name
            - name: MC_DB_USER
              valueFrom:
                secretKeyRef:
                  name: mission-control-db
                  key: database-user
            - name: MC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mission-control-db
                  key: database-password
            - name: MC_ADMIN_USUARIO
              valueFrom:
                secretKeyRef:
                  name: mission-control-admin
                  key: usuario
            - name: MC_ADMIN_SENHA_INICIAL
              valueFrom:
                secretKeyRef:
                  name: mission-control-admin
                  key: senha-inicial
          volumeMounts:
            - name: codigo
              mountPath: /opt/app-root/src
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: codigo
          projected:
            sources:
              - configMap:
                  name: mission-control-web
              - configMap:
                  name: mission-control-dados
---
apiVersion: v1
kind: Service
metadata:
  name: mission-control
  namespace: lateralshield
  labels:
    app.kubernetes.io/part-of: lateralshield-mission-control
spec:
  selector:
    app.kubernetes.io/name: mission-control
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# A senha trafega em cada requisição (autenticação Basic): a rota só aceita HTTPS.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mission-control
  namespace: lateralshield
  labels:
    app.kubernetes.io/part-of: lateralshield-mission-control
spec:
  to:
    kind: Service
    name: mission-control
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
# As políticas abaixo seguem o LS-OCP-002: entrada negada por padrão, liberada
# apenas do roteador de ingress para a aplicação e da aplicação para o banco.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ls-negar-entrada-por-padrao
  namespace: lateralshield
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ls-permitir-ingress-para-a-aplicacao
  namespace: lateralshield
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mission-control
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ls-permitir-aplicacao-para-o-banco
  namespace: lateralshield
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mission-control-mysql
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mission-control
      ports:
        - protocol: TCP
          port: 3306
