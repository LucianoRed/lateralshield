# GERADO por scripts/mission_control.py. Não edite manualmente.
# Fontes: mission-control/openshift/base.yaml e mission-control/web/.
#
#   oc new-project lateralshield
#   oc apply -f mission-control/openshift/mission-control.yaml
---
# Mission Control do LateralShield no OpenShift: aplicação, banco MySQL e rota.
#
# Este arquivo é a parte escrita à mão. O manifesto que se aplica é o
# mission-control.yaml, gerado por scripts/mission_control.py, que junta este
# arquivo aos ConfigMaps com a página e o código (mission-control/web/).
#
# A aplicação não precisa de build: usa a imagem UBI de PHP e lê o código de
# ConfigMaps. O usuário inicial é "admin" com a senha "redhat", e a troca da
# senha é exigida no primeiro acesso.
#
# O projeto não é criado aqui: crie-o antes, com "oc new-project lateralshield".
# Assim a instalação não exige permissão para criar namespaces.
#
# Credenciais do banco. O MySQL só aceita conexões do pod da aplicação (veja as
# NetworkPolicies no fim do arquivo). Troque a senha antes de aplicar, se quiser.
apiVersion: v1
kind: Secret
metadata:
  name: mission-control-db
  namespace: lateralshield
  labels:
    app.kubernetes.io/part-of: lateralshield-mission-control
type: Opaque
stringData:
  database-name: missioncontrol
  database-user: missioncontrol
  database-password: lateralshield-mission-control
---
# Usuário e senha iniciais da página. Só valem na primeira execução: depois
# disso a senha fica no banco, na forma de hash, e é trocada pela própria página.
apiVersion: v1
kind: Secret
metadata:
  name: mission-control-admin
  namespace: lateralshield
  labels:
    app.kubernetes.io/part-of: lateralshield-mission-control
type: Opaque
stringData:
  usuario: admin
  senha-inicial: redhat
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mission-control-mysql
  namespace: lateralshield
  labels:
    app.kubernetes.io/part-of: lateralshield-mission-control
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mission-control-mysql
  namespace: lateralshield
  labels:
    app.kubernetes.io/name: mission-control-mysql
    app.kubernetes.io/part-of: lateralshield-mission-control
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mission-control-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mission-control-mysql
        app.kubernetes.io/part-of: lateralshield-mission-control
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: registry.redhat.io/rhel9/mysql-80:latest
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mission-control-db
                  key: database-name
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mission-control-db
                  key: database-user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mission-control-db
                  key: database-password
          volumeMounts:
            - name: dados
              mountPath: /var/lib/mysql/data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - MYSQL_PWD="$MYSQL_PASSWORD" mysqladmin -u "$MYSQL_USER" -h 127.0.0.1 ping
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: dados
          persistentVolumeClaim:
            claimName: mission-control-mysql
---
apiVersion: v1
kind: Service
metadata:
  name: mission-control-mysql
  namespace: lateralshield
  labels:
    app.kubernetes.io/part-of: lateralshield-mission-control
spec:
  selector:
    app.kubernetes.io/name: mission-control-mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mission-control
  namespace: lateralshield
  labels:
    app.kubernetes.io/name: mission-control
    app.kubernetes.io/part-of: lateralshield-mission-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mission-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mission-control
        app.kubernetes.io/part-of: lateralshield-mission-control
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mission-control
          image: registry.access.redhat.com/ubi9/php-82:latest
          # Inicia o httpd e o PHP da imagem, sem etapa de build.
          args:
            - /usr/libexec/s2i/run
          ports:
            - name: http
              containerPort: 8080
          env:
            # Deixa o PHP ler as variáveis de ambiente do contêiner.
            - name: PHP_CLEAR_ENV
              value: "OFF"
            - name: DISPLAY_ERRORS
              value: "OFF"
            - name: HTTPD_START_SERVERS
              value: "2"
            - name: MC_DB_HOST
              value: mission-control-mysql
            - name: MC_DB_PORT
              value: "3306"
            - name: MC_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mission-control-db
                  key: database-name
            - name: MC_DB_USER
              valueFrom:
                secretKeyRef:
                  name: mission-control-db
                  key: database-user
            - name: MC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mission-control-db
                  key: database-password
            - name: MC_ADMIN_USUARIO
              valueFrom:
                secretKeyRef:
                  name: mission-control-admin
                  key: usuario
            - name: MC_ADMIN_SENHA_INICIAL
              valueFrom:
                secretKeyRef:
                  name: mission-control-admin
                  key: senha-inicial
          volumeMounts:
            - name: codigo
              mountPath: /opt/app-root/src
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: codigo
          projected:
            sources:
              - configMap:
                  name: mission-control-web
              - configMap:
                  name: mission-control-dados
---
apiVersion: v1
kind: Service
metadata:
  name: mission-control
  namespace: lateralshield
  labels:
    app.kubernetes.io/part-of: lateralshield-mission-control
spec:
  selector:
    app.kubernetes.io/name: mission-control
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# A senha trafega em cada requisição (autenticação Basic): a rota só aceita HTTPS.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: mission-control
  namespace: lateralshield
  labels:
    app.kubernetes.io/part-of: lateralshield-mission-control
spec:
  to:
    kind: Service
    name: mission-control
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
# As políticas abaixo seguem o LS-OCP-002: entrada negada por padrão, liberada
# apenas do roteador de ingress para a aplicação e da aplicação para o banco.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ls-negar-entrada-por-padrao
  namespace: lateralshield
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ls-permitir-ingress-para-a-aplicacao
  namespace: lateralshield
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mission-control
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ls-permitir-aplicacao-para-o-banco
  namespace: lateralshield
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mission-control-mysql
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mission-control
      ports:
        - protocol: TCP
          port: 3306
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mission-control-web
  namespace: lateralshield
  labels:
    app.kubernetes.io/part-of: lateralshield-mission-control
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mission Control · LateralShield</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&family=Red+Hat+Text:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      :root{
        --rh-red:#EE0000;--rh-red-dark:#B30000;--ink:#151515;--g700:#4A4A4A;--g400:#8A8A8A;--g300:#D2D2D2;--g100:#F5F5F5;--bg:#FFFFFF;
        --teal:#1A7A75;--teal-bg:#E6F4F3;--teal-bd:#BFE3E1;--amber:#9A6B00;--amber-bg:#FFF7E6;--amber-bd:#F0DCA8;--blue:#1D5FA8;--blue-bg:#EAF2FC;--blue-bd:#BFD6F2;
        --red-bg:#FFF1F1;--red-bd:#FFD9D9;--sb:264px;
        --c-aplicado:#118A6E;--c-impl:#3B6FE0;--c-exposto:#EE0000;--c-parcial:#D98A00;--c-trilha:#E4E4E4;--c-fundo:#DCEFEA;
      }
      *{box-sizing:border-box;margin:0;padding:0}
      [hidden]{display:none !important}
      html,body{height:100%}
      body{font-family:'Red Hat Text',system-ui,sans-serif;color:var(--ink);background:var(--g100);font-size:14.5px;line-height:1.5}
      a{color:var(--rh-red-dark)}
      h1,h2,h3,h4{font-family:'Red Hat Display',system-ui,sans-serif;font-weight:700;line-height:1.2}
      code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
      code{background:var(--g100);border:1px solid #E6E6E6;border-radius:4px;padding:0 4px}

      /* ---- menu lateral ---- */
      .sb{position:fixed;left:0;top:0;bottom:0;width:var(--sb);background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:22px 18px;z-index:10}
      .sb .brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
      .sb .brand svg{width:34px;height:38px;flex:none}
      .sb .brand b{display:block;font-family:'Red Hat Display',sans-serif;font-weight:900;font-size:19px;letter-spacing:-.3px}
      .sb .brand .mc{font-family:'Red Hat Display',sans-serif;font-weight:900;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#FF8A8A}
      .sb .proj{font-size:12px;color:#B9C4CE;margin:8px 0 18px;line-height:1.4;min-height:17px}
      .sb nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
      .sb nav a{display:flex;align-items:center;gap:10px;color:#D2D2D2;text-decoration:none;font-size:14px;font-weight:500;padding:9px 12px;border-radius:8px;border-left:3px solid transparent;transition:background .15s,color .15s}
      .sb nav a:hover{background:#2a2a2a;color:#fff}
      .sb nav a.on{background:#2a2a2a;color:#fff;border-left-color:var(--rh-red)}
      .sb nav a .cnt{margin-left:auto;font-size:11px;font-weight:700;background:#3a3a3a;color:#fff;border-radius:999px;padding:1px 8px}
      .sb nav a .cnt.hot{background:var(--rh-red)}
      .sb .foot{font-size:11px;color:#8A8A8A;line-height:1.55;padding-top:14px;border-top:1px solid #333}
      .sb .foot b{color:#D2D2D2}
      .sb .foot .ok{color:#7FD1CB}.sb .foot .bad{color:#FF8A8A}

      /* ---- conteúdo ---- */
      main{margin-left:var(--sb);min-height:100vh;padding:34px 40px 60px}
      .sec{display:none;max-width:1240px}
      .sec.on{display:block}
      .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--rh-red);margin-bottom:8px}
      h1.t{font-size:32px;font-weight:900;margin-bottom:6px}
      h1.t em{font-style:normal;color:var(--rh-red)}
      .lead{font-size:15.5px;color:var(--g700);max-width:880px;margin-bottom:22px}
      .card{background:var(--bg);border:1px solid var(--g300);border-radius:14px;padding:18px 20px;position:relative;overflow:hidden}
      .card.mark::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rh-red)}
      .card h3{font-size:15px;margin-bottom:10px}
      .card p.sub{font-size:13px;color:var(--g700);margin:-4px 0 12px}
      .grid{display:grid;gap:16px;margin-bottom:16px}
      .g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
      .kpi{background:var(--bg);border:1px solid var(--g300);border-radius:14px;padding:16px 18px}
      .kpi .l{font-size:11.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--g400)}
      .kpi .v{font-family:'Red Hat Display',sans-serif;font-size:34px;font-weight:900;line-height:1.1;margin:6px 0 2px}
      .kpi .v small{font-size:17px;color:var(--g400);font-weight:700}
      .kpi .v.red{color:var(--rh-red)}.kpi .v.teal{color:var(--teal)}.kpi .v.amber{color:var(--amber)}
      .kpi .s{font-size:12.5px;color:var(--g700)}
      .muted{color:var(--g400);font-size:12.5px}
      .aviso{background:var(--amber-bg);border:1px solid var(--amber-bd);color:#5C4000;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px}

      .pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;border-radius:999px;padding:3px 9px;border:1px solid var(--g300);white-space:nowrap;vertical-align:middle;color:#6E6E6E;background:#F5F5F5}
      .pill.exposto,.pill.nao,.pill.late{color:var(--rh-red-dark);background:var(--red-bg);border-color:var(--red-bd)}
      .pill.em-implantacao,.pill.conter{color:var(--blue);background:var(--blue-bg);border-color:var(--blue-bd)}
      .pill.aplicado,.pill.sim,.pill.detectar{color:var(--teal);background:var(--teal-bg);border-color:var(--teal-bd)}
      .pill.parcial,.pill.prevenir{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-bd)}
      .pill.p1{color:#fff;background:var(--ink);border-color:var(--ink)}
      .pill.nao-se-aplica{border-style:dashed}

      table.t{width:100%;border-collapse:collapse;background:var(--bg);border:1px solid var(--g300);border-radius:14px;overflow:hidden}
      table.t th{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--g400);text-align:left;padding:10px 12px;background:var(--g100);border-bottom:1px solid var(--g300)}
      table.t td{padding:10px 12px;border-top:1px solid #ECECEC;vertical-align:top;font-size:13.5px}
      table.t tr:first-child td{border-top:0}
      table.t td.id{font-family:ui-monospace,Menlo,monospace;font-weight:700;white-space:nowrap;font-size:12.5px}
      table.t td.n{text-align:center;font-variant-numeric:tabular-nums}
      table.t td.nw{white-space:nowrap}
      table.t a{text-decoration:none;font-weight:700}
      .tw{overflow-x:auto;border-radius:14px}
      .due{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;color:var(--g700)}
      .due.late{color:var(--rh-red-dark)}

      .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
      .bar .lb{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--g400);min-width:92px}
      .chip{font:inherit;font-size:12px;font-weight:700;border:1.5px solid var(--g300);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--g700);user-select:none}
      .chip:hover{border-color:var(--g400)}
      .chip.on{border-color:var(--rh-red);color:var(--rh-red-dark);background:var(--red-bg)}
      .chip small{font-weight:500;color:var(--g400);margin-left:4px}
      input.q{border:1.5px solid var(--g300);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;min-width:240px;margin-left:auto}
      input.q:focus{outline:none;border-color:var(--rh-red)}
      .btn{font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--g300);background:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;color:var(--g700);text-decoration:none;display:inline-block}
      .btn:hover{border-color:var(--rh-red);color:var(--rh-red-dark)}
      .btn.pri{background:var(--rh-red);border-color:var(--rh-red);color:#fff}
      .btn.pri:hover{background:var(--rh-red-dark);border-color:var(--rh-red-dark);color:#fff}
      .btns{display:flex;flex-wrap:wrap;gap:10px}

      /* ---- itens do checklist ---- */
      .grp{font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--g700);margin:22px 0 4px}
      .grp small{font-weight:500;letter-spacing:0;text-transform:none;color:var(--g400);font-size:13px;margin-left:8px}
      .grpsub{font-size:13.5px;color:var(--g700);margin-bottom:8px}
      .it{background:#fff;border:1px solid var(--g300);border-left:4px solid var(--g300);border-radius:10px;margin-top:6px}
      .it.exposto,.it.nao{border-left-color:var(--rh-red)}
      .it.em-implantacao{border-left-color:var(--blue)}
      .it.aplicado,.it.sim{border-left-color:var(--teal)}
      .it.parcial{border-left-color:#D9A100}
      .it .hd{display:grid;grid-template-columns:108px 1fr 168px 20px;gap:12px;align-items:center;padding:9px 14px;cursor:pointer}
      .it .hd .id{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:12.5px;white-space:nowrap}
      .it .hd .ti{font-size:13.5px;font-weight:500}
      .it .hd .ti .pill{margin-left:6px}
      .it .hd .chev{color:var(--g400);transition:transform .15s;font-size:12px}
      .it.open .hd .chev{transform:rotate(180deg)}
      .it .dono{display:block;font-size:12px;color:var(--g700);font-weight:400;margin-top:2px}
      .it .dono:empty{display:none}
      select.st{font:inherit;font-size:12.5px;font-weight:700;border:1.5px solid var(--g300);border-radius:999px;padding:5px 10px;background:#fff;color:var(--g700);cursor:pointer;width:100%}
      select.st.exposto,select.st.nao{color:var(--rh-red-dark);background:var(--red-bg);border-color:var(--red-bd)}
      select.st.em-implantacao{color:var(--blue);background:var(--blue-bg);border-color:var(--blue-bd)}
      select.st.aplicado,select.st.sim{color:var(--teal);background:var(--teal-bg);border-color:var(--teal-bd)}
      select.st.parcial{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-bd)}
      .it .bd{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:24px;padding:6px 16px 18px;border-top:1px solid #ECECEC}
      .it .bd h4{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--g400);margin:14px 0 5px}
      .it .bd p,.it .bd li{font-size:13.5px;color:#2b2b2b}
      .it .bd p{margin-bottom:8px}
      .it .bd ul{margin:0 0 8px 18px}
      .it .bd li{margin-bottom:3px}
      pre.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;background:var(--g100);border:1px solid var(--g300);border-radius:10px;padding:10px 12px;overflow:auto;margin:0 0 8px;white-space:pre}
      .form label{display:block;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--g400);margin-top:14px}
      .form input,.form textarea,.meta input,.meta textarea,.pw input{display:block;width:100%;margin-top:5px;font:inherit;font-size:13.5px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--ink);border:1.5px solid var(--g300);border-radius:8px;padding:7px 10px;background:#fff}
      .form textarea{min-height:110px;resize:vertical}
      .form input:focus,.form textarea:focus,.meta input:focus,.meta textarea:focus,.pw input:focus{outline:none;border-color:var(--rh-red)}
      .form .muted{margin-top:10px}
      .meta{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
      .meta label,.pw label{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--g400)}
      .meta .wide{grid-column:1/-1}

      /* ---- gráficos ---- */
      .sbar{display:flex;gap:2px;height:10px;min-width:120px}
      .sbar i{display:block;flex:0 0 0;min-width:5px;border-radius:5px;position:relative;background:var(--c-trilha)}
      .sbar i::before{content:'';position:absolute;left:0;right:0;top:-9px;bottom:-9px}
      .sbar .aplicado,.sbar .sim,.sw.aplicado,.sw.sim{background:var(--c-aplicado)}
      .sbar .em-implantacao,.sw.em-implantacao{background:var(--c-impl)}
      .sbar .exposto,.sbar .nao,.sw.exposto,.sw.nao{background:var(--c-exposto)}
      .sbar .parcial,.sw.parcial{background:var(--c-parcial)}
      .sbar .nao-se-aplica,.sw.nao-se-aplica{background:repeating-linear-gradient(135deg,#BDBDBD 0 3px,#E4E4E4 3px 6px)}
      .sw.nao-avaliado,.sw.sem-resposta{background:var(--c-trilha)}
      .crow{display:grid;grid-template-columns:var(--lb,104px) 1fr 122px;gap:12px;align-items:center;padding:7px 0;font-size:13px}
      .crow .cl a{text-decoration:none;font-weight:700}
      .crow .cv{text-align:right;color:var(--g700);font-variant-numeric:tabular-nums;white-space:nowrap}
      ul.lst{list-style:none;display:grid;gap:8px}
      ul.lst li{display:flex;gap:10px;align-items:baseline;font-size:13.5px}
      ul.lst li .id{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:12px;min-width:98px;text-decoration:none}
      ul.lst li .x{flex:1}
      .leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--g700);margin-top:12px}
      .leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
      .leg svg{vertical-align:-5px;margin-right:4px}
      .leg b{color:var(--ink);margin-left:4px}
      #tip{position:fixed;z-index:60;pointer-events:none;display:none;background:var(--ink);color:#fff;font-size:12px;line-height:1.4;padding:6px 10px;border-radius:6px;max-width:320px;white-space:pre-line}

      /* ---- nível de proteção ---- */
      .hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
      .nv{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;align-items:center}
      .gauge{display:block;width:100%}
      .gnum{font-family:'Red Hat Display',sans-serif;font-weight:900;font-size:52px;fill:var(--ink)}
      .gsub{font-size:10.5px;font-weight:700;letter-spacing:1.5px;fill:var(--g400)}
      .gfill{animation:gfill .9s ease-out}
      @keyframes gfill{from{stroke-dasharray:0 271}}
      .nvn{font-family:'Red Hat Display',sans-serif;font-weight:900;font-size:20px;text-align:center;margin-top:4px}
      .nvn small{display:block;font-family:'Red Hat Text',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--g400)}
      .degraus{display:flex;gap:3px;justify-content:center;margin-top:8px}
      .degraus i{width:28px;height:5px;border-radius:3px;background:var(--c-fundo)}
      .degraus i.on{background:var(--c-aplicado)}
      .nvp{font-size:14.5px;margin-bottom:12px}
      h4.mini{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--g400);margin-bottom:8px}
      .ganho{font-size:12px;font-weight:700;background:var(--c-fundo);border-radius:999px;padding:1px 8px;white-space:nowrap}
      .marco{display:grid;grid-template-columns:20px minmax(0,1fr) 58px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid #ECECEC}
      .marco.um{border-top:0;padding-top:0}
      .marco .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--g300);color:#fff;font-size:12px;font-weight:700;line-height:16px;text-align:center}
      .marco.ok .ck{background:var(--c-aplicado);border-color:var(--c-aplicado)}
      .marco a{display:block;color:inherit;text-decoration:none}
      .marco b{display:block;font-size:13.5px}
      .marco .d{display:block;font-size:12px;color:var(--g700)}
      .marco .n{text-align:right;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
      .meter{height:6px;border-radius:3px;background:var(--c-fundo);margin-top:5px;overflow:hidden}
      .meter i{display:block;height:100%;border-radius:3px;background:var(--c-aplicado)}
      .rings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
      .rings svg{width:96px;display:block;margin:0 auto 6px}
      .rings b{display:block;font-size:13.5px}
      .rnum{font-family:'Red Hat Display',sans-serif;font-weight:900;font-size:17px;fill:var(--ink)}

      /* ---- topologia de ataque ---- */
      .tpr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:28px;align-items:center}
      .tpr .big{font-family:'Red Hat Display',sans-serif;font-weight:900;font-size:30px;line-height:1.1;display:block}
      .tpr .s{font-size:12.5px;color:var(--g700)}
      .tpr .r{text-align:right}
      #tp-svg svg{display:block;width:100%;height:auto;min-width:900px}
      .tz{fill:#FAFAFA;stroke:#E6E6E6}
      .tzl{font-size:10.5px;font-weight:700;letter-spacing:1.5px;fill:var(--g400)}
      .tinv{font-size:11px;font-weight:700;letter-spacing:2.5px;fill:#fff}
      .tstub{fill:none;stroke:#6E6E6E;stroke-width:1.5}
      .te{fill:none;stroke-width:2;stroke-linecap:round}
      .thit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
      .tn rect{fill:#fff;stroke:var(--g300);stroke-width:1.5}
      .tn text{font-size:12.5px;font-weight:700;fill:var(--ink)}
      .tn.ent rect{fill:var(--ink);stroke:var(--ink)}
      .tn.ent text{fill:#fff}
      .tn.aberto rect{fill:var(--red-bg);stroke:var(--c-exposto)}
      .tn.parcial rect{fill:var(--amber-bg);stroke:var(--c-parcial)}
      .tn.mitigado rect{fill:var(--c-fundo);stroke:var(--c-aplicado)}
      .tn.desconhecido rect{stroke:#8A8A8A}
      .tn.fora rect{fill:#FAFAFA;stroke-dasharray:4 3}
      .tn.fora text{fill:var(--g400)}
      .tsh,.tsn{cursor:pointer;outline:none}
      .foco{fill:none;stroke:none;stroke-width:2}
      .sel .foco,.tsh:focus-visible .foco,.tsn:focus-visible .foco{stroke:var(--ink)}
      .tpl tr[data-caminho]{cursor:pointer}
      .tpl tr[data-caminho]:hover td{background:#FAFAFA}
      .tpl tr.sel td{background:var(--g100)}
      #tp-detalhe{margin-top:16px}
      #tp-detalhe h3 .pill{margin-left:8px}
      @media (prefers-reduced-motion:reduce){.gfill{animation:none}}

      /* ---- matriz 80/20 ---- */
      .mx{display:grid;grid-template-columns:120px repeat(3,1fr);gap:10px}
      .mx .ax{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--g400);display:flex;align-items:center;justify-content:center;text-align:center}
      .mx .ax.row{justify-content:flex-end;text-align:right;padding-right:6px}
      .mx .cell{background:#fff;border:1px solid var(--g300);border-radius:12px;padding:12px 14px;min-height:112px}
      .mx .cell.off{background:#FAFAFA;border-style:dashed}
      .mx .cell h4{font-size:13px;margin-bottom:8px}
      .mx .cell.p1 h4{color:var(--rh-red-dark)}
      .mx .cell.off h4{color:var(--g400);font-weight:500}
      .cid{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;margin:0 4px 5px 0;border:1px solid var(--g300);background:#fff;color:var(--g700);text-decoration:none}
      .cid.exposto{color:var(--rh-red-dark);background:var(--red-bg);border-color:var(--red-bd)}
      .cid.em-implantacao{color:var(--blue);background:var(--blue-bg);border-color:var(--blue-bd)}
      .cid.aplicado{color:var(--teal);background:var(--teal-bg);border-color:var(--teal-bd)}
      .cid.nao-se-aplica{color:var(--g400);border-style:dashed}

      /* ---- modal de senha ---- */
      .veu{position:fixed;inset:0;background:rgba(21,21,21,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
      .veu.on{display:flex}
      .pw{background:#fff;border-radius:16px;padding:26px 28px;width:100%;max-width:440px}
      .pw h2{font-size:22px;font-weight:900;margin-bottom:6px}
      .pw p{font-size:13.5px;color:var(--g700);margin-bottom:6px}
      .pw label{display:block;margin-top:14px}
      .pw .err{color:var(--rh-red-dark);font-size:13px;font-weight:700;min-height:20px;margin-top:12px}
      .pw .btns{margin-top:8px;justify-content:flex-end}

      #impressao{display:none}
      @media (max-width:1000px){
        .sb{position:static;width:auto;padding:14px 16px}
        .sb nav{flex-direction:row;flex-wrap:wrap}
        .sb .foot{display:none}
        main{margin-left:0;padding:22px 16px 50px}
        .g2,.g4,.meta{grid-template-columns:1fr 1fr}
        .hero,.nv,.tpr{grid-template-columns:1fr}
        .gauge{max-width:230px;margin:0 auto}
        .tpr .r{text-align:left}
        .it .hd{grid-template-columns:1fr 150px 16px}
        .it .hd .id{grid-column:1/-1}
        .it .bd{grid-template-columns:1fr}
        .mx{grid-template-columns:70px repeat(3,minmax(150px,1fr));overflow-x:auto}
      }
      @media print{
        @page{size:A4;margin:14mm}
        body{background:#fff;font-size:10.5px}
        .sb,main,.veu{display:none !important}
        #impressao{display:block}
        #impressao h1{font-size:22px;margin-bottom:4px}
        #impressao h2{font-size:14px;margin:18px 0 6px;padding-bottom:3px;border-bottom:2px solid var(--rh-red)}
        #impressao p{margin-bottom:4px}
        #impressao table{width:100%;border-collapse:collapse;margin-bottom:8px}
        #impressao th{font-size:8.5px;letter-spacing:1px;text-transform:uppercase;text-align:left;background:#EEE;padding:4px 6px}
        #impressao td{padding:4px 6px;border-bottom:1px solid #DDD;vertical-align:top}
        #impressao tr{break-inside:avoid}
        #impressao .pill{font-size:8px;padding:1px 6px}
      }
    </style>
    </head>
    <body>

    <aside class="sb">
      <div class="brand">
        <svg viewBox="0 0 34 38" aria-hidden="true"><path d="M17 1 32 6v11c0 9.6-6.2 16.300-15 20C8.200 33.300 2 26.600 2 17V6z" fill="#EE0000"/><path d="M11 12v14h12v-3.400h-8V12z" fill="#fff"/></svg>
        <div><b>LateralShield</b><span class="mc">Mission Control</span></div>
      </div>
      <div class="proj" id="sb-proj"></div>
      <nav id="nav"></nav>
      <div class="foot" id="sb-foot"></div>
    </aside>

    <main>
      <section class="sec" id="s-visao"></section>
      <section class="sec" id="s-topologia"></section>
      <section class="sec" id="s-controles"></section>
      <section class="sec" id="s-prioridades"></section>
      <section class="sec" id="s-processos"></section>
      <section class="sec" id="s-plano"></section>
      <section class="sec" id="s-incidentes"></section>
      <section class="sec" id="s-relatorio"></section>
    </main>

    <div class="veu" id="veu">
      <form class="pw" id="pw" autocomplete="off">
        <h2 id="pw-t">Trocar a senha</h2>
        <p id="pw-d"></p>
        <input type="text" id="pw-usuario" autocomplete="username" hidden>
        <label>Senha atual<input type="password" id="pw-atual" autocomplete="current-password" required></label>
        <label>Nova senha<input type="password" id="pw-nova" autocomplete="new-password" required></label>
        <label>Repita a nova senha<input type="password" id="pw-rep" autocomplete="new-password" required></label>
        <div class="err" id="pw-err"></div>
        <div class="btns">
          <button type="button" class="btn" id="pw-cancelar">Cancelar</button>
          <button type="submit" class="btn pri">Salvar a nova senha</button>
        </div>
      </form>
    </div>

    <div id="tip" role="tooltip"></div>
    <div id="impressao"></div>

    <script src="data.js"></script>
    <script>
    (function () {
      'use strict';
      const D = window.LS_DADOS;
      const $ = (s, el) => (el || document).querySelector(s);
      const ROT = {
        'nao-avaliado': 'Não avaliado', 'exposto': 'Exposto', 'em-implantacao': 'Em implantação', 'aplicado': 'Aplicado',
        'nao-se-aplica': 'Não se aplica', 'sem-resposta': 'Sem resposta', 'sim': 'Sim', 'parcial': 'Parcial', 'nao': 'Não'
      };
      const SITUACOES = {
        controle: ['nao-avaliado', 'exposto', 'em-implantacao', 'aplicado', 'nao-se-aplica'],
        processo: ['sem-resposta', 'sim', 'parcial', 'nao']
      };
      const LACUNA = ['exposto', 'em-implantacao', 'nao', 'parcial'];
      const SECOES = [
        ['visao', 'Visão geral'], ['topologia', 'Topologia de ataque'], ['controles', 'Controles'], ['prioridades', 'Matriz 80/20'], ['processos', 'Processos'],
        ['plano', 'Plano de ação'], ['incidentes', 'Incidentes'], ['relatorio', 'Relatório e dados']
      ];
      const CHAVE = 'lateralshield-mission-control-v1';
      const BASE = location.protocol === 'file:' ? '../../' : D.repositorio + '/blob/main/';
      // Endereço absoluto da API, sem usuário e senha, mesmo que a página tenha sido aberta com eles no endereço.
      const API = location.origin + location.pathname.replace(/[^/]*$/, '') + 'api/';

      const E = { meta: {}, itens: {} };
      let modo = 'local', usuario = '', senhaMinima = 10, salvo = null, trocaObrigatoria = false;
      const F = { tec: '', pilar: '', pri: '', st: '', q: '' };
      const abertos = new Set();

      const CONTROLE = {}, PERGUNTA = {}, TIPO = {};
      D.controles.forEach(c => { CONTROLE[c.id] = c; TIPO[c.id] = 'controle'; });
      D.processos.blocos.forEach(b => b.perguntas.forEach(p => { PERGUNTA[p.id] = p; TIPO[p.id] = 'processo'; }));
      const TEC = {};
      D.tecnologias.forEach(t => { TEC[t.id] = t; });

      // ---------------------------------------------------------------- utilitários
      const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
      const hoje = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
      const dataBR = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; };
      const pill = (classe, texto) => '<span class="pill ' + classe + '">' + esc(texto) + '</span>';
      const maiuscula = s => s.charAt(0).toUpperCase() + s.slice(1);

      function item(id) {
        const padrao = { status: SITUACOES[TIPO[id]][0], responsavel: '', prazo: '', nota: '', atualizado_em: '', atualizado_por: '' };
        return Object.assign(padrao, E.itens[id] || {});
      }
      const vencido = it => !!it.prazo && it.prazo < hoje() && LACUNA.includes(it.status);

      function destino(url) {
        if (/^https?:\/\//.test(url)) return { href: url, externo: true };
        const m = /^catalogo\/[a-z-]+\/(LS-[A-Z]+-\d{3})-/.exec(url);
        if (m && CONTROLE[m[1]]) return { href: '#controles/' + m[1] };
        if (/^[a-z][a-z0-9+.-]*:/i.test(url)) return null;
        return { href: BASE + url, externo: true };
      }
      function link(url, textoHtml, arquivo) {
        const d = arquivo ? { href: BASE + url, externo: true } : destino(url);
        if (!d) return textoHtml;
        return '<a href="' + d.href + '"' + (d.externo ? ' target="_blank" rel="noopener"' : '') + '>' + textoHtml + '</a>';
      }

      // Markdown mínimo: parágrafos, listas, tabelas, blocos de código, `código`, **negrito**, *itálico* e links.
      function emLinha(texto) {
        const codigos = [];
        let s = esc(texto).replace(/`([^`]+)`/g, (m, c) => { codigos.push(c); return '\u0001' + (codigos.length - 1) + '\u0001'; });
        s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\*([^*\s][^*]*)\*/g, '<i>$1</i>');
        s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => link(u, t));
        return s.replace(/\u0001(\d+)\u0001/g, (m, n) => '<code>' + codigos[+n] + '</code>');
      }
      function md(texto) {
        let html = '';
        String(texto || '').split(/```[a-z]*\n([\s\S]*?)```/).forEach((parte, i) => {
          if (i % 2) { html += '<pre class="code">' + esc(parte.replace(/\n$/, '')) + '</pre>'; return; }
          parte.split(/\n{2,}/).forEach(bloco => {
            const linhas = bloco.split('\n').filter(l => l.trim() !== '');
            if (!linhas.length) return;
            if (linhas.every(l => l.trim().startsWith('|'))) {
              const corpo = linhas.filter(l => !/^\s*\|\s*-/.test(l)).map(l => l.trim().replace(/^\||\|$/g, '').split('|'));
              html += '<div class="tw"><table class="t">' + corpo.map((cs, n) => '<tr>' + cs.map(c => (n ? '<td>' : '<th>') + emLinha(c.trim()) + (n ? '</td>' : '</th>')).join('') + '</tr>').join('') + '</table></div>';
            } else if (/^\s*[-*] /.test(linhas[0])) {
              const itens = [];
              linhas.forEach(l => { if (/^\s*[-*] /.test(l)) itens.push(l.replace(/^\s*[-*] /, '')); else itens[itens.length - 1] += ' ' + l.trim(); });
              html += '<ul>' + itens.map(x => '<li>' + emLinha(x) + '</li>').join('') + '</ul>';
            } else {
              html += '<p>' + emLinha(linhas.join(' ')) + '</p>';
            }
          });
        });
        return html;
      }

      // ---------------------------------------------------------------- persistência
      async function api(metodo, caminho, corpo) {
        const cabecalhos = { Accept: 'application/json' };
        if (metodo !== 'GET') { cabecalhos['Content-Type'] = 'application/json'; cabecalhos['X-Requested-With'] = 'LateralShield'; }
        const r = await fetch(API + caminho, { method: metodo, headers: cabecalhos, body: corpo ? JSON.stringify(corpo) : undefined, credentials: 'same-origin' });
        let j = null;
        try { j = await r.json(); } catch (e) { /* resposta sem JSON */ }
        if (!r.ok) {
          const erro = new Error((j && j.mensagem) || ('Erro ' + r.status));
          erro.status = r.status; erro.chave = j && j.erro;
          throw erro;
        }
        return j;
      }
      function gravarLocal() {
        try { localStorage.setItem(CHAVE, JSON.stringify({ meta: E.meta, itens: E.itens })); return true; } catch (e) { return false; }
      }
      function carregarLocal() {
        try {
          const j = JSON.parse(localStorage.getItem(CHAVE) || '{}');
          E.meta = j.meta || {}; E.itens = j.itens || {};
        } catch (e) { /* armazenamento indisponível: a página funciona sem guardar */ }
      }
      function marcar(ok, mensagem) {
        salvo = { ok: ok, texto: mensagem || (ok ? 'Salvo às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : 'Não foi possível salvar') };
        rodape();
      }
      const agoraUTC = () => new Date().toISOString().slice(0, 19).replace('T', ' ');

      async function salvarItem(id, campos) {
        const it = item(id);
        Object.assign(it, campos, { atualizado_em: agoraUTC(), atualizado_por: usuario || 'local' });
        E.itens[id] = it;
        if (modo === 'servidor') {
          try { E.itens[id] = (await api('PUT', 'item/' + id, it)).item; marcar(true); }
          catch (e) { marcar(false, e.status === 401 ? 'Sessão encerrada: recarregue a página' : e.message); }
        } else {
          marcar(gravarLocal());
        }
        menu();
      }
      async function salvarMeta(chave, valor) {
        E.meta[chave] = valor;
        if (modo === 'servidor') {
          try { E.meta = (await api('PUT', 'meta', { [chave]: valor })).meta || {}; marcar(true); }
          catch (e) { marcar(false, e.message); }
        } else {
          marcar(gravarLocal());
        }
        menu();
      }

      // ---------------------------------------------------------------- contagens
      function contar() {
        const c = { controle: {}, processo: {}, tec: {} };
        D.controles.forEach(x => {
          const s = item(x.id).status;
          c.controle[s] = (c.controle[s] || 0) + 1;
          c.tec[x.tecnologia] = c.tec[x.tecnologia] || {};
          c.tec[x.tecnologia][s] = (c.tec[x.tecnologia][s] || 0) + 1;
        });
        Object.keys(PERGUNTA).forEach(id => { const s = item(id).status; c.processo[s] = (c.processo[s] || 0) + 1; });
        return c;
      }
      function lacunas() {
        const lista = [];
        D.controles.forEach(c => {
          const it = item(c.id);
          if (LACUNA.includes(it.status)) lista.push({ id: c.id, rotulo: c.id, href: '#controles/' + c.id, descricao: c.titulo, prioridade: c.prioridade, it: it });
        });
        lista.sort((a, b) => a.prioridade - b.prioridade || a.id.localeCompare(b.id));
        Object.values(PERGUNTA).forEach(p => {
          const it = item(p.id);
          if (LACUNA.includes(it.status)) lista.push({ id: p.id, rotulo: 'Pergunta ' + p.n, href: '#processos/' + p.id, descricao: p.pergunta, prioridade: '', it: it });
        });
        return lista;
      }

      // ---------------------------------------------------------------- menu e rodapé
      function menu() {
        const c = contar(), n = lacunas().length;
        const lacunasProcesso = (c.processo.nao || 0) + (c.processo.parcial || 0);
        const numeros = { controles: [c.controle.exposto || 0, true], processos: [lacunasProcesso, true], plano: [n, false] };
        const atual = (location.hash.slice(1).split('/')[0]) || 'visao';
        $('#nav').innerHTML = SECOES.map(([id, nome]) => {
          const num = numeros[id];
          const cnt = num && num[0] ? '<span class="cnt' + (num[1] ? ' hot' : '') + '">' + num[0] + '</span>' : '';
          return '<a href="#' + id + '"' + (id === atual ? ' class="on"' : '') + '>' + nome + cnt + '</a>';
        }).join('');
        $('#sb-proj').textContent = [E.meta.organizacao, E.meta.ambiente].filter(Boolean).join(' · ') || 'Avaliação do ambiente';
      }
      function rodape() {
        const onde = modo === 'servidor'
          ? '<b>Servidor</b> · usuário ' + esc(usuario) + '<br>Respostas guardadas no banco de dados'
          : '<b>Modo local</b><br>Respostas guardadas só neste navegador';
        const estado = salvo ? '<br><span class="' + (salvo.ok ? 'ok' : 'bad') + '">' + esc(salvo.texto) + '</span>' : '';
        $('#sb-foot').innerHTML = onde + estado + '<br>' + D.controles.length + ' controles · catálogo em rascunho';
      }

      // ---------------------------------------------------------------- itens do checklist
      function seletor(id, it) {
        return '<select class="st ' + it.status + '" data-campo="status" aria-label="Situação de ' + esc(id) + '">'
          + SITUACOES[TIPO[id]].map(s => '<option value="' + s + '"' + (s === it.status ? ' selected' : '') + '>' + ROT[s] + '</option>').join('') + '</select>';
      }
      function formulario(id, it, rotuloNota) {
        return '<div class="form">'
          + '<label>Responsável<input data-campo="responsavel" maxlength="200" value="' + esc(it.responsavel) + '" placeholder="Pessoa ou time"></label>'
          + '<label>Prazo<input type="date" data-campo="prazo" value="' + esc(it.prazo) + '"></label>'
          + '<label>' + rotuloNota + '<textarea data-campo="nota" maxlength="4000" placeholder="O que foi verificado, onde está a evidência, o que falta">' + esc(it.nota) + '</textarea></label>'
          + '<div class="muted quando">' + esc(textoQuando(it)) + '</div></div>';
      }
      function textoDono(it) {
        const partes = [];
        if (it.responsavel) partes.push(esc(it.responsavel));
        if (it.prazo) partes.push('<span class="due' + (vencido(it) ? ' late' : '') + '">' + dataBR(it.prazo) + (vencido(it) ? ' · vencido' : '') + '</span>');
        return partes.join(' · ');
      }
      const resumoDono = it => '<span class="dono">' + textoDono(it) + '</span>';
      const textoQuando = it => it.atualizado_em
        ? 'Atualizado em ' + dataBR(it.atualizado_em) + ' ' + it.atualizado_em.slice(11, 16) + ' UTC' + (it.atualizado_por ? ' por ' + it.atualizado_por : '')
        : 'Ainda sem registro';
      function linha(id) {
        const it = item(id), aberto = abertos.has(id);
        let titulo, corpo = '';
        if (TIPO[id] === 'controle') {
          const c = CONTROLE[id];
          titulo = '<span class="id">' + c.id + '</span><span class="ti">' + esc(c.titulo) + pill(c.pilar, c.pilar) + pill(c.prioridade === 1 ? 'p1' : '', 'P' + c.prioridade) + resumoDono(it) + '</span>';
          if (aberto) {
            corpo = '<div class="bd"><div>'
              + '<h4>Problema</h4>' + md(c.problema)
              + '<h4>Benefício</h4>' + md(c.beneficio)
              + '<h4>Como avaliar · somente leitura</h4>' + md(c.avaliacao)
              + '<p class="muted">' + link(c.arquivo, 'Abrir o controle completo', true) + ' · implementação, validação, reversão e detecção<br>'
              + esc(TEC[c.tecnologia].nome) + ' · ' + esc(c.versoes) + ' · impacto ' + c.impacto + ', esforço ' + c.esforco + ' · no catálogo: ' + c.status + '</p>'
              + '</div>' + formulario(id, it, 'Evidência e observações') + '</div>';
          }
        } else {
          const p = PERGUNTA[id];
          titulo = '<span class="id">Pergunta ' + p.n + '</span><span class="ti">' + esc(p.pergunta) + resumoDono(it) + '</span>';
          if (aberto) {
            corpo = '<div class="bd"><div>'
              + '<h4>O que conta como "sim"</h4>' + md(p.sim)
              + '<h4>Por que importa</h4>' + md(p.porque)
              + (p.primeiro_passo ? '<h4>Primeiro passo de baixo esforço</h4>' + md(p.primeiro_passo) : '')
              + '</div>' + formulario(id, it, 'Evidência e o que falta') + '</div>';
          }
        }
        return '<div class="it ' + it.status + (aberto ? ' open' : '') + '" data-id="' + id + '"><div class="hd">' + titulo + seletor(id, it) + '<span class="chev">&#9662;</span></div>' + corpo + '</div>';
      }
      function redesenharLinha(id) {
        document.querySelectorAll('.it[data-id="' + id + '"]').forEach(el => { el.outerHTML = linha(id); });
      }
      // Depois de salvar, atualiza só o cabeçalho da linha: o formulário aberto não perde o foco.
      function atualizarLinha(id) {
        const it = item(id);
        document.querySelectorAll('.it[data-id="' + id + '"]').forEach(el => {
          el.className = 'it ' + it.status + (abertos.has(id) ? ' open' : '');
          const sel = $('select.st', el), dono = $('.dono', el), quando = $('.quando', el);
          if (sel) sel.className = 'st ' + it.status;
          if (dono) dono.innerHTML = textoDono(it);
          if (quando) quando.textContent = textoQuando(it);
        });
        const st = contar().controle;
        document.querySelectorAll('.chip[data-filtro="st"]').forEach(chip => {
          const n = $('small', chip);
          if (n) n.textContent = st[chip.dataset.valor] || 0;
        });
      }

      // ---------------------------------------------------------------- seções
      function cabecalho(olho, titulo, lead) {
        return '<div class="eyebrow">' + olho + '</div><h1 class="t">' + titulo + '</h1><p class="lead">' + lead + '</p>';
      }

      // ---------------------------------------------------------------- nível de proteção e gráficos
      // O nível mede só a cobertura dos controles do catálogo. As perguntas de processo não entram e continuam sem nota.
      const real = id => item(id).status;
      const PESO = { 1: 3, 2: 2, 3: 1 };
      const NIVEIS = [[0, 'Inicial'], [20, 'Básico'], [40, 'Intermediário'], [65, 'Avançado'], [90, 'Consolidado']];
      const COR = { aplicado: '#118A6E', impl: '#3B6FE0', exposto: '#EE0000', parcial: '#D98A00', neutro: '#8A8A8A', fundo: '#DCEFEA' };

      function nivel(st) {
        let total = 0, soma = 0, andamento = 0;
        const faltam = [];
        D.controles.forEach(c => {
          const s = st(c.id), p = PESO[c.prioridade] || 1;
          if (s === 'nao-se-aplica') return;
          total += p;
          if (s === 'aplicado') soma += p; else faltam.push(c);
          if (s === 'em-implantacao') andamento += p;
        });
        const pontos = total ? Math.floor(100 * soma / total) : 0;
        let n = 0;
        NIVEIS.forEach((x, i) => { if (pontos >= x[0]) n = i; });
        // O que falta, na ordem em que mais vale a pena: prioridade, lacuna já conhecida, logs centralizados e ordem do catálogo.
        const ordem = { 'exposto': 0, 'em-implantacao': 1, 'nao-avaliado': 2 }, logs = D.logs.map(l => l.id);
        const pos = c => (logs.includes(c.id) ? 0 : 1000) + D.controles.indexOf(c);
        faltam.sort((a, b) => a.prioridade - b.prioridade || ordem[st(a.id)] - ordem[st(b.id)] || pos(a) - pos(b));
        return {
          total: total, pontos: pontos, n: n, nome: NIVEIS[n][1], proximo: NIVEIS[n + 1] || null, faltam: faltam,
          andamento: total ? Math.round(100 * andamento / total) : 0,
          ganho: c => Math.max(1, Math.round(100 * (PESO[c.prioridade] || 1) / total))
        };
      }
      function medidor(nv) {
        const r = 86, cx = 110, cy = 106, comp = Math.PI * r;
        const arco = 'M' + (cx - r) + ' ' + cy + 'A' + r + ' ' + r + ' 0 0 1 ' + (cx + r) + ' ' + cy;
        const marcas = NIVEIS.slice(1).map(x => {
          const a = Math.PI * (1 - x[0] / 100), c = Math.cos(a), s = Math.sin(a);
          return '<line x1="' + (cx + (r - 10) * c).toFixed(1) + '" y1="' + (cy - (r - 10) * s).toFixed(1) + '" x2="' + (cx + (r + 10) * c).toFixed(1) + '" y2="' + (cy - (r + 10) * s).toFixed(1) + '" stroke="#fff" stroke-width="2"/>';
        }).join('');
        return '<svg class="gauge" viewBox="0 0 220 124" role="img" aria-label="Nível de proteção: ' + nv.pontos + ' de 100. Nível ' + (nv.n + 1) + ' de ' + NIVEIS.length + ', ' + nv.nome + '.">'
          + '<path d="' + arco + '" fill="none" stroke="' + COR.fundo + '" stroke-width="16" stroke-linecap="round"/>'
          + (nv.pontos ? '<path class="gfill" d="' + arco + '" fill="none" stroke="' + COR.aplicado + '" stroke-width="16" stroke-linecap="round" stroke-dasharray="' + (comp * nv.pontos / 100).toFixed(1) + ' ' + comp.toFixed(1) + '"/>' : '')
          + marcas
          + '<text x="110" y="98" text-anchor="middle" class="gnum">' + nv.pontos + '</text><text x="110" y="117" text-anchor="middle" class="gsub">DE 100</text></svg>';
      }
      function anel(n, total) {
        const r = 30, comp = 2 * Math.PI * r;
        return '<svg viewBox="0 0 80 80" aria-hidden="true"><circle cx="40" cy="40" r="' + r + '" fill="none" stroke="' + COR.fundo + '" stroke-width="9"/>'
          + (n ? '<circle cx="40" cy="40" r="' + r + '" fill="none" stroke="' + COR.aplicado + '" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + (comp * n / total).toFixed(1) + ' ' + comp.toFixed(1) + '" transform="rotate(-90 40 40)"/>' : '')
          + '<text x="40" y="46" text-anchor="middle" class="rnum">' + (total ? Math.round(100 * n / total) + '%' : '&ndash;') + '</text></svg>';
      }
      // Barra segmentada: partes = [[classe, quantidade, nome]].
      function barra(partes, nome) {
        const total = partes.reduce((a, p) => a + p[1], 0);
        const texto = p => p[2] + ': ' + p[1] + ' de ' + total + ' (' + Math.round(100 * p[1] / total) + '%)';
        const visiveis = partes.filter(p => p[1]);
        return '<div class="sbar" role="img" aria-label="' + esc(nome + '. ' + visiveis.map(texto).join('; ')) + '">'
          + visiveis.map(p => '<i class="' + p[0] + '" style="flex-grow:' + p[1] + '" data-tip="' + esc(texto(p)) + '"></i>').join('') + '</div>';
      }
      function legenda(itens) {
        return '<div class="leg">' + itens.map(x => '<span><i class="sw ' + x[0] + '"></i>' + x[1] + (x[2] != null ? '<b>' + x[2] + '</b>' : '') + '</span>').join('') + '</div>';
      }
      function linhasDeBarra(linhas, largura) {
        return '<div style="--lb:' + largura + 'px">' + linhas.map(l => '<div class="crow"><span class="cl">' + l[0] + '</span>' + barra(l[1], l[2]) + '<span class="cv">' + l[3] + '</span></div>').join('') + '</div>';
      }
      const ORDEM_CONTROLE = ['aplicado', 'em-implantacao', 'exposto', 'nao-avaliado', 'nao-se-aplica'];
      const partesControle = x => ORDEM_CONTROLE.map(s => [s, x[s] || 0, ROT[s]]);
      const aplicadosDe = x => (x.aplicado || 0) + ' de ' + (Object.values(x).reduce((a, b) => a + b, 0) - (x['nao-se-aplica'] || 0)) + ' aplicados';
      function marcos(st, cam) {
        const ap = ids => { const a = ids.filter(id => st(id) !== 'nao-se-aplica'); return [a.filter(id => st(id) === 'aplicado').length, a.length]; };
        const ids = D.controles.map(c => c.id), pri = n => D.controles.filter(c => c.prioridade === n).map(c => c.id);
        const ce = contarEstados(cam);
        return [
          ['Tudo avaliado', 'Cada controle com a situação registrada', ids.filter(id => st(id) !== 'nao-avaliado').length, ids.length, '#controles', ''],
          ['Logs centralizados', 'A primeira verificação: sem eles, os alertas não chegam a ninguém'].concat(ap(D.logs.map(l => l.id)), ['#controles', '']),
          ['Prioridade 1 aplicada', 'Impacto alto com esforço baixo'].concat(ap(pri(1)), ['#controles', '1']),
          ['Prioridade 2 aplicada', 'O passo seguinte da matriz 80/20'].concat(ap(pri(2)), ['#controles', '2']),
          ['Prioridade 3 aplicada', 'O que fecha o catálogo'].concat(ap(pri(3)), ['#controles', '3']),
          ['Caminhos de ataque fechados', 'Mitigados ou gerando alerta na topologia', ce.mitigado, cam.length - ce.fora, '#topologia', '']
        ].filter(m => m[3] > 0);
      }

      function visao() {
        const c = contar(), total = D.controles.length, cc = c.controle, cp = c.processo;
        const avaliados = total - (cc['nao-avaliado'] || 0);
        const gaps = lacunas();
        const semDono = gaps.filter(g => !g.it.responsavel).length;
        const atrasados = gaps.filter(g => vencido(g.it));
        const m = E.meta, nv = nivel(real), cam = caminhos(real), ce = contarEstados(cam);
        let h = cabecalho('Mission Control', 'Avaliação <em>do ambiente</em>', 'Assuma o comprometimento, contenha o impacto. Cada controle aplicado fecha um caminho do invasor: acompanhe aqui o nível de proteção do ambiente e o que falta fechar.');
        if (modo === 'local') h += '<div class="aviso"><b>Modo local.</b> As respostas ficam só neste navegador. Para guardar em banco de dados e gerar o relatório em PDF e Excel, instale o Mission Control no OpenShift (veja <a href="#relatorio">Relatório e dados</a>).</div>';

        h += '<div class="hero"><div class="card mark"><h3>Nível de proteção</h3><div class="nv"><div>' + medidor(nv)
          + '<div class="nvn">' + nv.nome + '<small>Nível ' + (nv.n + 1) + ' de ' + NIVEIS.length + '</small></div>'
          + '<div class="degraus">' + NIVEIS.map((x, i) => '<i' + (i <= nv.n ? ' class="on"' : '') + ' data-tip="Nível ' + (i + 1) + ' · ' + x[1] + ': a partir de ' + x[0] + ' pontos"></i>').join('') + '</div></div><div>';
        if (!nv.total) {
          h += '<p class="nvp">Nenhum controle do catálogo se aplica a este ambiente.</p>';
        } else {
          h += '<p class="nvp">' + (nv.proximo
            ? (nv.proximo[0] - nv.pontos === 1 ? 'Falta <b>1 ponto</b>' : 'Faltam <b>' + (nv.proximo[0] - nv.pontos) + ' pontos</b>') + ' para o nível ' + (nv.n + 2) + ' · ' + nv.proximo[1] + '.'
            : (nv.faltam.length ? 'Nível mais alto. Faltam ' + nv.faltam.length + ' controles para fechar o catálogo.' : 'Todos os controles aplicáveis estão aplicados. Repita a avaliação periodicamente: configuração de segurança se degrada com o tempo.'))
            + (nv.andamento ? ' Há <b>' + nv.andamento + (nv.andamento === 1 ? ' ponto' : ' pontos') + ' a caminho</b> nos controles em implantação.' : '') + '</p>';
          if (nv.faltam.length) {
            h += '<h4 class="mini">O que mais soma agora</h4><ul class="lst">'
              + nv.faltam.slice(0, 3).map(x => '<li><a class="id" href="#controles/' + x.id + '">' + x.id + '</a><span class="x">' + esc(x.titulo) + '</span><span class="ganho" data-tip="Pontos que este controle soma quando aplicado">+' + nv.ganho(x) + '</span></li>').join('') + '</ul>';
          }
        }
        h += '<p class="muted" style="margin-top:12px">Parcela dos controles aplicáveis que já está aplicada, com peso 3, 2 e 1 para as prioridades 1, 2 e 3. Controle não avaliado conta como não aplicado, e as perguntas de processo não entram. Mede a cobertura do catálogo neste ambiente: não é certificação nem garantia de segurança.</p></div></div></div>';

        h += '<div class="card"><h3>Marcos</h3>' + marcos(real, cam).map((mc, i) => {
          const ok = mc[2] >= mc[3];
          return '<div class="marco' + (ok ? ' ok' : '') + (i ? '' : ' um') + '"><span class="ck">' + (ok ? '&#10003;' : '') + '</span><a href="' + mc[4] + '"' + (mc[5] ? ' data-pri="' + mc[5] + '"' : '') + '><b>' + mc[0] + '</b><span class="d">' + mc[1] + '</span><div class="meter"><i style="width:' + (100 * mc[2] / mc[3]) + '%"></i></div></a><span class="n">' + mc[2] + ' / ' + mc[3] + '</span></div>';
        }).join('') + '</div></div>';

        h += '<div class="grid g4">'
          + '<div class="kpi"><div class="l">Controles avaliados</div><div class="v">' + avaliados + '<small> / ' + total + '</small></div><div class="s">' + (cc['nao-avaliado'] || 0) + ' ainda sem avaliação</div></div>'
          + '<div class="kpi"><div class="l">Expostos</div><div class="v red">' + (cc.exposto || 0) + '</div><div class="s">' + (cc['em-implantacao'] || 0) + ' em implantação</div></div>'
          + '<div class="kpi"><div class="l">Aplicados</div><div class="v teal">' + (cc.aplicado || 0) + '</div><div class="s">' + (cc['nao-se-aplica'] || 0) + ' não se aplicam</div></div>'
          + '<div class="kpi"><div class="l">Lacunas de processo</div><div class="v amber">' + ((cp.nao || 0) + (cp.parcial || 0)) + '</div><div class="s">' + (cp['sem-resposta'] || 0) + ' perguntas sem resposta</div></div>'
          + '</div>';

        h += '<div class="grid g2"><div class="card"><h3>Aplicados por pilar</h3><p class="sub">Controles aplicados entre os que se aplicam ao ambiente.</p><div class="rings">'
          + ['prevenir', 'conter', 'detectar'].map(p => {
            const ids = D.controles.filter(x => x.pilar === p && real(x.id) !== 'nao-se-aplica'), n = ids.filter(x => real(x.id) === 'aplicado').length;
            return '<div>' + anel(n, ids.length) + '<b>' + maiuscula(p) + '</b><span class="muted">' + n + ' de ' + ids.length + ' aplicados</span></div>';
          }).join('') + '</div></div>';
        h += '<div class="card"><h3>Caminhos de ataque</h3><p class="sub"><b>' + ce.mitigado + ' de ' + (cam.length - ce.fora) + '</b> caminhos de movimentação lateral do modelo de ameaça estão mitigados ou geram alerta.</p>'
          + barra(partesCaminho(ce), 'Caminhos de ataque') + legendaCaminhos(ce)
          + '<p style="margin-top:16px"><a class="btn pri" href="#topologia">Ver a topologia de ataque</a></p></div></div>';

        const porPri = {};
        D.controles.forEach(x => { const p = porPri[x.prioridade] = porPri[x.prioridade] || {}, s = real(x.id); p[s] = (p[s] || 0) + 1; });
        h += '<div class="grid g2"><div class="card"><h3>Situação por tecnologia</h3>'
          + linhasDeBarra(D.tecnologias.map(t => { const x = c.tec[t.id] || {}; return ['<a href="#controles" data-tec="' + t.id + '">' + esc(t.curto) + '</a>', partesControle(x), t.nome, aplicadosDe(x)]; }), 86)
          + legenda(ORDEM_CONTROLE.map(s => [s, ROT[s]])) + '</div>';
        h += '<div class="card"><h3>Situação por prioridade</h3>'
          + linhasDeBarra(Object.keys(porPri).sort().map(p => ['<a href="#controles" data-pri="' + p + '">Prioridade ' + p + '</a>', partesControle(porPri[p]), 'Prioridade ' + p, aplicadosDe(porPri[p])]), 86)
          + legenda(ORDEM_CONTROLE.map(s => [s, ROT[s]])) + '</div></div>';

        h += '<div class="grid g2"><div class="card mark"><h3>Primeira verificação: os logs saem do servidor?</h3><p class="sub">Sem destino central, os alertas dos demais controles não chegam a ninguém.</p><ul class="lst">'
          + D.logs.map(l => '<li><a class="id" href="#controles/' + l.id + '">' + l.id + '</a><span class="x">' + esc(l.camada) + '</span>' + pill(item(l.id).status, ROT[item(l.id).status]) + '</li>').join('')
          + '</ul></div>';
        h += '<div class="card mark"><h3>Processos: comece por estas perguntas</h3><p class="sub">Um "não" aqui deve ser tratado junto com os primeiros controles, e não depois.</p><ul class="lst">'
          + D.processos.chave.map(n => { const p = PERGUNTA['PROC-' + String(n).padStart(2, '0')]; if (!p) return ''; const it = item(p.id); return '<li><a class="id" href="#processos/' + p.id + '">Pergunta ' + p.n + '</a><span class="x">' + esc(p.pergunta) + '</span>' + pill(it.status, ROT[it.status]) + '</li>'; }).join('')
          + '</ul></div></div>';

        h += '<div class="grid g2"><div class="card"><h3>Respostas de processo por bloco</h3><p class="sub">Contagem das respostas. Elas não são somadas nem viram nota.</p>'
          + linhasDeBarra(D.processos.blocos.map(b => {
            const x = {};
            b.perguntas.forEach(p => { const s = item(p.id).status; x[s] = (x[s] || 0) + 1; });
            const lac = (x.nao || 0) + (x.parcial || 0);
            return [esc(b.nome), ['sim', 'parcial', 'nao', 'sem-resposta'].map(s => [s, x[s] || 0, ROT[s]]), b.nome, lac + (lac === 1 ? ' lacuna' : ' lacunas')];
          }), 176)
          + legenda(['sim', 'parcial', 'nao', 'sem-resposta'].map(s => [s, ROT[s]])) + '</div>';

        h += '<div class="card"><h3>Próximos passos</h3>';
        if (!avaliados) {
          h += '<p class="sub">Nada foi avaliado ainda. Comece pela primeira verificação e siga pelos controles de prioridade 1, rodando a avaliação somente leitura de cada um.</p><a class="btn pri" href="#controles">Abrir os controles</a>';
        } else if (!gaps.length) {
          h += '<p class="sub">Nenhuma lacuna registrada. Continue a avaliação dos controles restantes e repita-a periodicamente: configuração de segurança se degrada com o tempo.</p>';
        } else {
          h += '<p class="sub">' + gaps.length + ' lacunas no plano de ação' + (semDono ? ', ' + semDono + ' sem responsável' : '') + (atrasados.length ? ', ' + atrasados.length + ' com prazo vencido' : '') + '.</p><ul class="lst">'
            + gaps.slice(0, 6).map(g => '<li><a class="id" href="' + g.href + '">' + esc(g.rotulo) + '</a><span class="x">' + esc(g.descricao) + '</span>' + (vencido(g.it) ? pill('late', 'vencido') : pill(g.it.status, ROT[g.it.status])) + '</li>').join('')
            + '</ul><p style="margin-top:12px"><a class="btn" href="#plano">Ver o plano de ação</a></p>';
        }
        h += '</div></div>';

        h += '<div class="card"><h3>Esta avaliação</h3><div class="meta">'
          + '<label>Organização<input data-meta="organizacao" maxlength="200" value="' + esc(m.organizacao) + '"></label>'
          + '<label>Ambiente<input data-meta="ambiente" maxlength="200" value="' + esc(m.ambiente) + '" placeholder="Produção, homologação..."></label>'
          + '<label>Responsável<input data-meta="responsavel" maxlength="200" value="' + esc(m.responsavel) + '"></label>'
          + '<label>Início<input type="date" data-meta="inicio" value="' + esc(m.inicio) + '"></label>'
          + '<label class="wide">Observações<input data-meta="observacoes" maxlength="2000" value="' + esc(m.observacoes) + '" placeholder="Escopo, quem participou, o que ficou de fora"></label>'
          + '</div></div>';
        $('#s-visao').innerHTML = h;
      }

      // ---------------------------------------------------------------- topologia de ataque
      // Os caminhos e os controles de cada um vêm do modelo de ameaça (D.ameacas). Aqui fica só o desenho:
      // cada linha da tabela é ligada, por um dos seus controles, a uma aresta (bloqueio) ou a um sinal em um nó (detecção).
      const TOPO = {
        w: 1160, h: 886, alt: 36,
        zonas: [['JBoss EAP', 16, 146], ['OpenShift', 160, 446], ['RHEL', 460, 694], ['Ansible Automation Platform', 708, 870]],
        // nó: [x do centro, y do centro, largura, rótulo, 'e' quando é ponto de entrada]
        nos: {
          jboss: [290, 84, 190, 'JBoss EAP legado', 'e'],
          pod: [290, 306, 190, 'Pod de aplicação', 'e'],
          conta: [290, 410, 190, 'Conta do OpenShift', 'e'],
          rhel: [290, 580, 190, 'Servidor RHEL', 'e'],
          automacao: [290, 776, 190, 'Conta ou chave do AAP', 'e'],
          consoles: [660, 58, 230, 'Consoles de outros JBoss'],
          rede: [660, 110, 230, 'Rede interna além do banco'],
          mcs: [660, 202, 230, 'Machine Config Server'],
          pods: [660, 254, 230, 'Outros pods e namespaces'],
          no: [660, 306, 230, 'Nó do OpenShift'],
          secrets: [660, 358, 230, 'Secrets e API do cluster'],
          plano: [660, 410, 230, 'Plano de controle'],
          ssh: [660, 502, 230, 'Outros servidores por SSH'],
          root: [660, 554, 230, 'Root no servidor'],
          processos: [660, 606, 230, 'Outros processos do host'],
          redes: [660, 658, 230, 'Outras portas e redes'],
          gerenciados: [660, 750, 230, 'Servidores gerenciados'],
          aap: [660, 802, 230, 'Ansible Automation Platform'],
          credenciais: [1040, 776, 200, 'Credenciais guardadas'],
          ambientes: [1040, 836, 200, 'Todos os ambientes']
        },
        arestas: {
          'LS-JBOSS-001': ['jboss', 'consoles'], 'LS-JBOSS-002': ['jboss', 'rede'], 'LS-OCP-001': ['jboss', 'mcs'],
          'LS-OCP-002': ['pod', 'pods'], 'LS-OCP-008': ['pod', 'no'], 'LS-OCP-010': ['pod', 'secrets'], 'LS-OCP-004': ['conta', 'plano'],
          'LS-RHEL-001': ['rhel', 'ssh'], 'LS-RHEL-004': ['rhel', 'root'], 'LS-RHEL-006': ['rhel', 'processos'], 'LS-RHEL-008': ['rhel', 'redes'],
          'LS-AAP-001': ['automacao', 'gerenciados'], 'LS-AAP-002': ['automacao', 'aap'], 'LS-AAP-004': ['aap', 'credenciais'], 'LS-AAP-009': ['aap', 'ambientes']
        },
        sensores: { 'LS-JBOSS-003': 'jboss', 'LS-OCP-003': 'pod', 'LS-OCP-006': 'plano', 'LS-RHEL-002': 'rhel', 'LS-RHEL-003': 'rhel', 'LS-AAP-007': 'aap' }
      };
      const ESTADOS = ['mitigado', 'parcial', 'aberto', 'desconhecido', 'fora'];
      const ROT_ESTADO = {
        bloqueio: { mitigado: 'Mitigado', parcial: 'Parcial', aberto: 'Aberto', desconhecido: 'Não avaliado', fora: 'Não se aplica' },
        deteccao: { mitigado: 'Com alerta', parcial: 'Parcial', aberto: 'Sem alerta', desconhecido: 'Não avaliado', fora: 'Não se aplica' }
      };
      const PILL_ESTADO = { mitigado: 'aplicado', parcial: 'parcial', aberto: 'exposto', desconhecido: '', fora: 'nao-se-aplica' };
      const COR_ESTADO = { mitigado: COR.aplicado, parcial: COR.parcial, aberto: COR.exposto, desconhecido: COR.neutro, fora: '#C8C8C8' };
      const semMovimento = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
      let SIM = 0, caminhoSel = null, pausado = false;
      // Situação mostrada no desenho: a registrada ou, na simulação, com as prioridades escolhidas já aplicadas.
      const stVisao = id => { const s = real(id); return SIM && s !== 'nao-se-aplica' && CONTROLE[id].prioridade <= SIM ? 'aplicado' : s; };

      function caminhos(st) {
        return D.ameacas.caminhos.map((c, n) => {
          const ss = c.controles.map(st).filter(s => s !== 'nao-se-aplica'), ap = ss.filter(s => s === 'aplicado').length;
          let estado = 'desconhecido', aresta = null, no = null;
          if (!ss.length) estado = 'fora';
          else if (ap === ss.length) estado = 'mitigado';
          else if (ap || ss.includes('em-implantacao')) estado = 'parcial';
          else if (ss.includes('exposto')) estado = 'aberto';
          c.controles.some(id => { aresta = TOPO.arestas[id] || null; no = aresta ? null : (TOPO.sensores[id] || null); return aresta || no; });
          return { n: n, texto: c.caminho, controles: c.controles, estado: estado, aresta: aresta, no: no, tipo: c.controles.every(id => CONTROLE[id].pilar === 'detectar') ? 'deteccao' : 'bloqueio' };
        });
      }
      function contarEstados(lista) {
        const ce = {};
        ESTADOS.forEach(e => { ce[e] = lista.filter(c => c.estado === e).length; });
        return ce;
      }
      const rotEstado = c => ROT_ESTADO[c.tipo][c.estado];
      const pillEstado = c => pill(PILL_ESTADO[c.estado], rotEstado(c));
      const partesCaminho = ce => [['aplicado', ce.mitigado, 'Mitigados ou com alerta'], ['parcial', ce.parcial, 'Parciais'], ['exposto', ce.aberto, 'Abertos ou sem alerta'], ['nao-avaliado', ce.desconhecido, 'Não avaliados'], ['nao-se-aplica', ce.fora, 'Não se aplicam']];
      const legendaCaminhos = ce => legenda(partesCaminho(ce).filter(p => p[1] || p[0] !== 'nao-se-aplica').map(p => [p[0], p[2], p[1]]));
      const dica = c => c.texto.replace(/`/g, '') + '\n' + rotEstado(c) + ' · ' + c.controles.map(id => id + ' ' + ROT[stVisao(id)].toLowerCase()).join(', ');

      function escudo(estado) {
        const forma = 'M0 -10L8 -7V0C8 5.5 4 9 0 10.5C-4 9 -8 5.5 -8 0V-7Z', cor = COR_ESTADO[estado];
        const cheio = estado === 'mitigado' || estado === 'parcial';
        const sinais = {
          mitigado: '<path d="M-3.5 0.5L-1 3L3.5 -2.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
          parcial: '<path d="M-3 0.5H3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>',
          aberto: '<path d="M-2.5 -2.5L2.5 2.5M2.5 -2.5L-2.5 2.5" fill="none" stroke="' + cor + '" stroke-width="2" stroke-linecap="round"/>',
          desconhecido: '<text y="4" text-anchor="middle" font-size="10" font-weight="700" fill="#6E6E6E">?</text>',
          fora: ''
        };
        return '<path d="' + forma + '" fill="#fff" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>'
          + '<path d="' + forma + '" fill="' + (cheio ? cor : '#fff') + '" stroke="' + cor + '" stroke-width="2" stroke-linejoin="round"' + (estado === 'fora' ? ' stroke-dasharray="3 2"' : '') + '/>' + sinais[estado];
      }
      function sinal(estado, anima) {
        const cor = COR_ESTADO[estado];
        let h = '';
        if (estado === 'mitigado' && anima) h += '<circle r="8" fill="none" stroke="' + cor + '" stroke-width="1.5"><animate attributeName="r" values="8;18" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite"/></circle>';
        h += '<circle r="8" fill="#fff" stroke="' + cor + '" stroke-width="2"/>';
        if (estado === 'mitigado' || estado === 'parcial') h += '<circle r="3.5" fill="' + cor + '"/>';
        if (estado === 'aberto') h += '<path d="M-3.5 3.5L3.5 -3.5" stroke="' + cor + '" stroke-width="2" stroke-linecap="round"/>';
        return h;
      }
      const alvoDoDesenho = (classe, c, x, y, raio, conteudo) => '<g class="' + classe + (c.n === caminhoSel ? ' sel' : '') + '" transform="translate(' + x + ' ' + y + ')" data-caminho="' + c.n + '" data-tip="' + esc(dica(c)) + '" tabindex="0" role="button" aria-label="' + esc(dica(c)) + '">'
        + '<circle r="' + raio + '" fill="transparent"/><circle r="' + raio + '" class="foco"/>' + conteudo + '</g>';

      function svgTopologia(lista) {
        const T = TOPO, anima = !semMovimento, pior = {}, porNo = {};
        const grau = ['fora', 'mitigado', 'desconhecido', 'parcial', 'aberto'];
        const ponto = (cor, caminho, dur, atraso, some) => '<circle r="4" fill="' + cor + '" stroke="#fff" stroke-width="1.5">'
          + '<animateMotion dur="' + dur + 's" begin="-' + atraso.toFixed(2) + 's" repeatCount="indefinite" path="' + caminho + '"/>'
          + (some ? '<animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="' + dur + 's" begin="-' + atraso.toFixed(2) + 's" repeatCount="indefinite"/>' : '') + '</circle>';
        let fundo = '', linhas = '', pontos = '', marcas = '', caixas = '';

        T.zonas.forEach(z => { fundo += '<rect x="64" y="' + z[1] + '" width="' + (T.w - 72) + '" height="' + (z[2] - z[1]) + '" rx="12" class="tz"/><text x="78" y="' + (z[1] + 20) + '" class="tzl">' + esc(z[0].toUpperCase()) + '</text>'; });
        fundo += '<rect x="12" y="16" width="40" height="' + (T.h - 32) + '" rx="10" fill="#151515"/><text transform="translate(36 ' + (T.h / 2) + ') rotate(-90)" text-anchor="middle" class="tinv">INVASOR · ASSUMA O COMPROMETIMENTO</text>';
        Object.keys(T.nos).forEach((k, i) => {
          const n = T.nos[k];
          if (n[4] !== 'e') return;
          const d = 'M52 ' + n[1] + 'H' + (n[0] - n[2] / 2);
          fundo += '<path d="' + d + '" class="tstub"/>';
          if (anima) pontos += '<circle r="3" fill="#151515"><animateMotion dur="2.4s" begin="-' + (i * 0.5).toFixed(2) + 's" repeatCount="indefinite" path="' + d + '"/></circle>';
        });

        lista.forEach(c => {
          if (c.no) { (porNo[c.no] = porNo[c.no] || []).push(c); return; }
          if (!c.aresta) return;
          const a = T.nos[c.aresta[0]], b = T.nos[c.aresta[1]], k = c.aresta[1];
          if (pior[k] == null || grau.indexOf(c.estado) > grau.indexOf(pior[k])) pior[k] = c.estado;
          const x1 = a[0] + a[2] / 2, y1 = a[1], x2 = b[0] - b[2] / 2, y2 = b[1], mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
          const inteiro = 'M' + x1 + ' ' + y1 + 'C' + mx + ' ' + y1 + ' ' + mx + ' ' + y2 + ' ' + x2 + ' ' + y2;
          const ate = 'M' + x1 + ' ' + y1 + 'C' + (x1 + mx) / 2 + ' ' + y1 + ' ' + (x1 + 3 * mx) / 4 + ' ' + (3 * y1 + y2) / 4 + ' ' + mx + ' ' + my;
          const depois = 'M' + mx + ' ' + my + 'C' + (3 * mx + x2) / 4 + ' ' + (y1 + 3 * y2) / 4 + ' ' + (mx + x2) / 2 + ' ' + y2 + ' ' + x2 + ' ' + y2;
          const cor = COR_ESTADO[c.estado], atraso = (c.n * 0.37) % 1.4;
          if (c.estado === 'mitigado') {
            // O ataque continua saindo do componente invadido, mas para no escudo.
            linhas += '<path class="te" d="' + ate + '" stroke="#C4C4C4"/><path class="te" d="' + depois + '" stroke="' + cor + '" stroke-opacity="0.5"/>';
            if (anima) pontos += ponto(COR.exposto, ate, 1.6, atraso, true);
          } else if (c.estado === 'fora') {
            linhas += '<path class="te" d="' + inteiro + '" stroke="#D6D6D6" stroke-width="1" stroke-dasharray="3 4"/>';
          } else {
            linhas += '<path class="te" d="' + inteiro + '" stroke="' + cor + '"' + (c.estado === 'desconhecido' ? ' stroke-dasharray="1 6"' : '') + '/>';
            if (anima) pontos += ponto(cor, inteiro, 2.8, atraso) + ponto(cor, inteiro, 2.8, atraso + 1.4);
          }
          linhas += '<path class="thit" d="' + inteiro + '" data-caminho="' + c.n + '" data-tip="' + esc(dica(c)) + '"/>';
          marcas += alvoDoDesenho('tsh', c, mx, my, 15, escudo(c.estado));
        });

        Object.keys(T.nos).forEach(k => {
          const n = T.nos[k], x = n[0] - n[2] / 2, y = n[1] - T.alt / 2;
          caixas += '<g class="tn ' + (n[4] === 'e' ? 'ent' : (pior[k] || 'fora')) + '"><rect x="' + x + '" y="' + y + '" width="' + n[2] + '" height="' + T.alt + '" rx="8"/><text x="' + (x + 12) + '" y="' + (n[1] + 4.5) + '">' + esc(n[3]) + '</text></g>';
          (porNo[k] || []).forEach((c, i) => { marcas += alvoDoDesenho('tsn', c, x + n[2] - 14 - 22 * i, y, 13, sinal(c.estado, anima)); });
        });

        const ce = contarEstados(lista);
        return '<svg viewBox="0 0 ' + T.w + ' ' + T.h + '" role="img" aria-label="Topologia de ataque: ' + ce.mitigado + ' de ' + (lista.length - ce.fora) + ' caminhos mitigados ou com alerta. A tabela abaixo lista todos os caminhos.">'
          + fundo + linhas + caixas + pontos + marcas + '</svg>';
      }

      function desenharTopologia() {
        const lista = caminhos(stVisao), ce = contarEstados(lista), nv = nivel(stVisao);
        $('#tp-resumo').innerHTML = (SIM ? '<div class="aviso"><b>Simulação.</b> O desenho mostra como o ambiente ficaria com esses controles aplicados. Nada é gravado, e a situação registrada não muda.</div>' : '')
          + '<div class="card" style="margin-bottom:16px"><div class="tpr"><div><span class="big">' + ce.mitigado + ' de ' + (lista.length - ce.fora) + '</span><span class="s">caminhos mitigados ou com alerta</span></div>'
          + '<div>' + barra(partesCaminho(ce), 'Caminhos de ataque') + legendaCaminhos(ce) + '</div>'
          + '<div class="r"><span class="big">' + nv.pontos + '</span><span class="s">nível de proteção · ' + nv.nome + '</span></div></div></div>';
        $('#tp-svg').innerHTML = svgTopologia(lista);
        const svg = $('#tp-svg svg');
        if (pausado && svg.pauseAnimations) svg.pauseAnimations();
        $('#tp-lista').innerHTML = '<div class="tw"><table class="t tpl"><tr><th>Caminho</th><th>Resposta</th><th>Controles</th><th>Situação</th></tr>'
          + lista.map(c => '<tr data-caminho="' + c.n + '"' + (c.n === caminhoSel ? ' class="sel"' : '') + '><td>' + emLinha(c.texto) + '</td><td class="nw">' + (c.tipo === 'deteccao' ? 'Detecção' : 'Bloqueio') + '</td><td>'
            + c.controles.map(id => '<a class="cid ' + stVisao(id) + '" href="#controles/' + id + '" title="' + esc(CONTROLE[id].titulo) + ' · ' + ROT[stVisao(id)] + '">' + id + '</a>').join('') + '</td><td class="nw">' + pillEstado(c) + '</td></tr>').join('')
          + '</table></div>';
        const marca = $('#tp-pill');
        if (marca && caminhoSel != null) marca.innerHTML = pillEstado(lista[caminhoSel]);
      }
      function detalheCaminho() {
        const el = $('#tp-detalhe');
        if (caminhoSel == null) {
          el.innerHTML = '<p class="muted">Clique em um escudo, em um sinal de detecção ou em uma linha da tabela para ver os controles do caminho e registrar a situação aqui mesmo.</p>';
          return;
        }
        const c = caminhos(stVisao)[caminhoSel];
        el.innerHTML = '<div class="card mark"><h3>' + emLinha(c.texto) + '<span id="tp-pill">' + pillEstado(c) + '</span></h3><p class="sub">'
          + (c.tipo === 'deteccao' ? 'Controles que fazem este caminho gerar alerta.' : 'Controles que fecham este caminho.')
          + (SIM ? ' As situações abaixo são as registradas; o desenho mostra a simulação.' : ' Mude a situação de um controle e o desenho acompanha.') + '</p>'
          + c.controles.map(linha).join('') + '</div>';
      }
      function selecionarCaminho(n, rolar) {
        caminhoSel = n;
        desenharTopologia();
        detalheCaminho();
        if (rolar) $('#tp-detalhe').scrollIntoView({ block: 'nearest', behavior: semMovimento ? 'auto' : 'smooth' });
      }
      function topologia() {
        const mini = e => '<svg viewBox="-12 -13 24 26" width="18" height="20" aria-hidden="true">' + e + '</svg>';
        let h = cabecalho('Movimentação lateral', 'Topologia <em>de ataque</em>', 'Um componente foi invadido: o desenho mostra até onde o invasor consegue ir a partir dele. Cada controle aplicado fecha um caminho ou faz com que ele gere alerta. Os caminhos vêm do ' + link(D.ameacas.arquivo, 'modelo de ameaça') + '.');
        h += '<div class="bar"><span class="lb">Mostrar</span>'
          + [[0, 'Situação registrada'], [1, 'Com a prioridade 1 aplicada'], [2, 'Com as prioridades 1 e 2'], [3, 'Com todo o catálogo']].map(x => '<button type="button" class="chip' + (SIM === x[0] ? ' on' : '') + '" data-sim="' + x[0] + '">' + x[1] + '</button>').join('')
          + (semMovimento ? '' : '<button type="button" class="btn" data-acao="pausar" style="margin-left:auto">' + (pausado ? 'Retomar a animação' : 'Pausar a animação') + '</button>') + '</div>';
        h += '<div id="tp-resumo"></div><div class="card tp"><div class="tw" id="tp-svg"></div><div class="leg">'
          + '<span>' + mini(escudo('mitigado')) + 'Mitigado: o ataque para no escudo</span><span>' + mini(escudo('parcial')) + 'Parcial: falta controle</span><span>' + mini(escudo('aberto')) + 'Aberto: o invasor alcança o destino</span><span>' + mini(escudo('desconhecido')) + 'Não avaliado</span>'
          + '<span>' + mini(sinal('mitigado', false)) + 'Detecção: o componente gera alerta</span><span>' + mini(sinal('aberto', false)) + 'Sem alerta</span></div>'
          + '<p class="muted" style="margin-top:10px">O desenho reflete a situação registrada, e não um teste do ambiente. Os controles do catálogo estão em rascunho: só a validação de cada um confirma o bloqueio.</p></div>';
        h += '<div id="tp-detalhe"></div><h3 class="grp">Todos os caminhos</h3><div id="tp-lista"></div>';
        $('#s-topologia').innerHTML = h;
        detalheCaminho();
        desenharTopologia();
      }

      function filtrados() {
        const q = F.q.trim().toLowerCase();
        return D.controles.filter(c => {
          const it = item(c.id);
          return (!F.tec || c.tecnologia === F.tec) && (!F.pilar || c.pilar === F.pilar) && (!F.pri || String(c.prioridade) === F.pri)
            && (!F.st || it.status === F.st)
            && (!q || (c.id + ' ' + c.titulo + ' ' + c.problema + ' ' + it.responsavel + ' ' + it.nota).toLowerCase().includes(q));
        });
      }
      function chips(rotulo, chave, opcoes) {
        return '<div class="bar"><span class="lb">' + rotulo + '</span>' + opcoes.map(([valor, texto, n]) =>
          '<button type="button" class="chip' + (F[chave] === valor ? ' on' : '') + '" data-filtro="' + chave + '" data-valor="' + valor + '">' + esc(texto) + (n != null ? '<small>' + n + '</small>' : '') + '</button>').join('') + '</div>';
      }
      function controles() {
        const todos = D.controles, st = contar().controle;
        let h = cabecalho('Checklist', 'Controles <em>do catálogo</em>', 'Abra um controle para ver o problema, o benefício e os comandos de avaliação, que são somente leitura. Registre a situação no ambiente, quem responde por ela e até quando.');
        h += chips('Tecnologia', 'tec', [['', 'Todas', todos.length]].concat(D.tecnologias.map(t => [t.id, t.curto, todos.filter(c => c.tecnologia === t.id).length])));
        h += chips('Pilar', 'pilar', [['', 'Todos'], ['prevenir', 'Prevenir'], ['conter', 'Conter'], ['detectar', 'Detectar']]);
        h += chips('Prioridade', 'pri', [['', 'Todas'], ['1', 'Prioridade 1'], ['2', 'Prioridade 2'], ['3', 'Prioridade 3']]);
        h += '<div class="bar"><span class="lb">Situação</span><button type="button" class="chip' + (F.st === '' ? ' on' : '') + '" data-filtro="st" data-valor="">Todas</button>'
          + SITUACOES.controle.map(s => '<button type="button" class="chip' + (F.st === s ? ' on' : '') + '" data-filtro="st" data-valor="' + s + '">' + ROT[s] + '<small>' + (st[s] || 0) + '</small></button>').join('')
          + '<input class="q" id="q" type="search" placeholder="Buscar por identificador ou texto" value="' + esc(F.q) + '"></div>';
        h += '<div id="lista-controles"></div>';
        $('#s-controles').innerHTML = h;
        listaControles();
      }
      function listaControles() {
        const lista = filtrados();
        let h = '';
        D.tecnologias.forEach(t => {
          const grupo = lista.filter(c => c.tecnologia === t.id);
          if (grupo.length) h += '<h3 class="grp">' + esc(t.nome) + '<small>' + grupo.length + ' controles</small></h3>' + grupo.map(c => linha(c.id)).join('');
        });
        $('#lista-controles').innerHTML = h || '<p class="muted" style="margin-top:20px">Nenhum controle com esses filtros.</p>';
      }

      function prioridades() {
        const niveis = { impacto: ['alto', 'medio', 'baixo'], esforco: ['baixo', 'medio', 'alto'] };
        const nome = { alto: 'alto', medio: 'médio', baixo: 'baixo' };
        const faixa = { 'alto-baixo': 'Prioridade 1', 'alto-medio': 'Prioridade 2', 'medio-baixo': 'Prioridade 2', 'medio-medio': 'Prioridade 3', 'baixo-baixo': 'Prioridade 3', 'alto-alto': 'Só com justificativa' };
        let h = cabecalho('Método', 'Matriz <em>80/20</em>', 'Cada controle recebe uma nota de impacto e uma de esforço. Comece pelo canto de impacto alto e esforço baixo. A cor de cada identificador mostra a situação registrada neste ambiente.');
        h += '<div class="mx"><div></div>' + niveis.esforco.map(e => '<div class="ax">Esforço ' + nome[e] + '</div>').join('');
        niveis.impacto.forEach(i => {
          h += '<div class="ax row">Impacto ' + nome[i] + '</div>';
          niveis.esforco.forEach(e => {
            const rot = faixa[i + '-' + e], lista = D.controles.filter(c => c.impacto === i && c.esforco === e);
            h += '<div class="cell' + (rot ? (rot === 'Prioridade 1' ? ' p1' : '') : ' off') + '"><h4>' + (rot || 'Fora do catálogo') + (lista.length ? ' · ' + lista.length : '') + '</h4>'
              + lista.map(c => '<a class="cid ' + item(c.id).status + '" href="#controles/' + c.id + '" title="' + esc(c.titulo) + ' · ' + ROT[item(c.id).status] + '">' + c.id + '</a>').join('') + '</div>';
          });
        });
        h += '</div><div class="leg"><span><a class="cid exposto">LS</a>Exposto</span><span><a class="cid em-implantacao">LS</a>Em implantação</span><span><a class="cid aplicado">LS</a>Aplicado</span><span><a class="cid nao-se-aplica">LS</a>Não se aplica</span><span><a class="cid">LS</a>Não avaliado</span></div>';
        $('#s-prioridades').innerHTML = h;
      }

      function processos() {
        let h = cabecalho('Pessoas e processos', 'Avaliação básica <em>de processos</em>', 'Quem sustenta os controles? São ' + Object.keys(PERGUNTA).length + ' perguntas para uma conversa com as equipes, com três respostas: sim, parcial ou não. "Sim" exige evidência: um nome, um documento, uma data.');
        h += '<div class="aviso">Não há nota nem nível de maturidade, e as respostas não são somadas. O resultado é uma lista curta de lacunas, cada uma com responsável e prazo. ' + link(D.processos.arquivo, 'Como conduzir a avaliação') + '.</div>';
        D.processos.blocos.forEach(b => {
          h += '<h3 class="grp">' + esc(b.nome) + '</h3><div class="grpsub">' + esc(b.central) + '</div>' + b.perguntas.map(p => linha(p.id)).join('');
        });
        $('#s-processos').innerHTML = h;
      }

      function plano() {
        const gaps = lacunas();
        let h = cabecalho('Resultado', 'Plano <em>de ação</em>', 'Controles expostos ou em implantação, por prioridade, e perguntas de processo com resposta "não" ou "parcial". Cada linha precisa de um responsável e de um prazo.');
        if (!gaps.length) {
          h += '<div class="card"><p class="sub" style="margin:0">Nenhuma lacuna registrada até o momento. Marque um controle como exposto ou responda "não" ou "parcial" a uma pergunta para que ele apareça aqui.</p></div>';
        } else {
          h += '<div class="tw"><table class="t"><tr><th>Item</th><th>Lacuna</th><th>Situação</th><th>Pri.</th><th>Responsável</th><th>Prazo</th></tr>'
            + gaps.map(g => '<tr><td class="id"><a href="' + g.href + '">' + esc(g.rotulo) + '</a></td><td>' + esc(g.descricao) + (g.it.nota ? '<div class="muted">' + esc(g.it.nota) + '</div>' : '') + '</td><td class="nw">' + pill(g.it.status, ROT[g.it.status]) + '</td><td class="n">' + g.prioridade + '</td><td>' + (g.it.responsavel ? esc(g.it.responsavel) : pill('late', 'sem responsável')) + '</td><td class="nw"><span class="due' + (vencido(g.it) ? ' late' : '') + '">' + (dataBR(g.it.prazo) || '&mdash;') + (vencido(g.it) ? ' · vencido' : '') + '</span></td></tr>').join('')
            + '</table></div>';
        }
        $('#s-plano').innerHTML = h;
      }

      function incidentes() {
        let h = cabecalho('Em crise', 'Recomendações <em>para incidentes</em>', 'Medidas de emergência para um incidente em andamento. Não são controles: toda medida tem dono, prazo e forma de desfazer. Algumas apenas reduzem o volume de ataque, e a tabela indica quais.');
        h += '<div class="tw"><table class="t"><tr><th>Recomendação</th><th>Efeito</th><th>Reduz ruído ou contém?</th></tr>'
          + D.incidentes.itens.map(i => '<tr><td>' + link(i.link, esc(i.titulo)) + '</td><td>' + esc(i.efeito) + '</td><td class="nw">' + (/cont/i.test(i.tipo) ? pill('aplicado', i.tipo) : /ru/i.test(i.tipo) ? pill('parcial', i.tipo) : '&mdash;') + '</td></tr>').join('')
          + '</table></div><p style="margin-top:14px">' + link(D.incidentes.arquivo, 'Abrir as recomendações completas') + ', com quando usar, o que fazer, cuidados e como desfazer.</p>';
        $('#s-incidentes').innerHTML = h;
      }

      function relatorio() {
        let h = cabecalho('Saída', 'Relatório <em>e dados</em>', 'O relatório reúne o resumo, a primeira verificação, o plano de ação e a situação de cada controle e de cada pergunta.');
        h += '<div class="aviso"><b>Trate o resultado como informação sensível.</b> A lista de lacunas mostra onde o ambiente é mais frágil: guarde o relatório com acesso restrito.</div>';
        h += '<div class="grid g2"><div class="card mark"><h3>Relatório</h3>';
        if (modo === 'servidor') {
          h += '<p class="sub">Gerado pelo servidor a partir do que está no banco de dados.</p><div class="btns"><a class="btn pri" href="' + API + 'relatorio.pdf">Baixar em PDF</a><a class="btn pri" href="' + API + 'relatorio.xlsx">Baixar em Excel (.xlsx)</a><button type="button" class="btn" data-acao="imprimir">Imprimir</button></div>';
        } else {
          h += '<p class="sub">No modo local, o PDF sai pela impressão do navegador ("Salvar como PDF") e a planilha em CSV. PDF e Excel prontos para baixar exigem a instalação em servidor.</p><div class="btns"><button type="button" class="btn pri" data-acao="imprimir">Imprimir ou salvar em PDF</button><button type="button" class="btn pri" data-acao="csv">Baixar planilha (.csv)</button></div>';
        }
        h += '</div><div class="card"><h3>Cópia dos dados</h3><p class="sub">O arquivo JSON leva a avaliação de um lugar para outro: de um navegador para o servidor, ou de um ambiente para outro. Importar <b>substitui</b> as respostas atuais.</p><div class="btns">'
          + (modo === 'servidor' ? '<a class="btn" href="' + API + 'exportar.json">Exportar JSON</a>' : '<button type="button" class="btn" data-acao="exportar">Exportar JSON</button>')
          + '<button type="button" class="btn" data-acao="importar">Importar JSON</button>'
          + (modo === 'local' ? '<button type="button" class="btn" data-acao="apagar">Apagar os dados deste navegador</button>' : '')
          + '<input type="file" id="arquivo" accept="application/json,.json" hidden></div></div></div>';
        if (modo === 'servidor') {
          h += '<div class="card"><h3>Acesso</h3><p class="sub">Autenticado como <b>' + esc(usuario) + '</b>. A senha fica guardada no banco na forma de hash.</p><button type="button" class="btn" data-acao="senha">Trocar a senha</button></div>';
        } else {
          h += '<div class="card"><h3>Instalar no OpenShift</h3><p class="sub">Crie o projeto e aplique o manifesto: ele instala o Mission Control e um banco MySQL, com autenticação. O usuário inicial é <code>admin</code>, a senha inicial é <code>redhat</code> e a troca é exigida no primeiro acesso.</p><pre class="code">oc new-project lateralshield\noc apply -f ' + esc(D.repositorio.replace('github.com', 'raw.githubusercontent.com')) + '/main/mission-control/openshift/mission-control.yaml\noc get route mission-control -n lateralshield</pre><p class="muted">' + link('mission-control/README.md', 'Instruções completas') + ', incluindo como executar em um contêiner local.</p></div>';
        }
        $('#s-relatorio').innerHTML = h;
      }

      const DESENHAR = { visao: visao, topologia: topologia, controles: controles, prioridades: prioridades, processos: processos, plano: plano, incidentes: incidentes, relatorio: relatorio };

      function navegar() {
        const partes = location.hash.slice(1).split('/');
        const secao = DESENHAR[partes[0]] ? partes[0] : 'visao';
        const alvo = partes[1];
        if (alvo && TIPO[alvo]) {
          abertos.add(alvo);
          if (TIPO[alvo] === 'controle') { F.tec = F.pilar = F.pri = F.st = F.q = ''; }
        }
        document.querySelectorAll('.sec').forEach(s => s.classList.toggle('on', s.id === 's-' + secao));
        DESENHAR[secao]();
        menu();
        const el = alvo && document.querySelector('#s-' + secao + ' .it[data-id="' + alvo + '"]');
        if (el) el.scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0);
      }

      // ---------------------------------------------------------------- relatório no navegador
      function imprimir() {
        const m = E.meta, c = contar(), gaps = lacunas();
        const tabela = (cab, linhas) => '<table><tr>' + cab.map(x => '<th>' + x + '</th>').join('') + '</tr>' + linhas.map(l => '<tr>' + l.map(x => '<td>' + x + '</td>').join('') + '</tr>').join('') + '</table>';
        const st = id => pill(item(id).status, ROT[item(id).status]);
        let h = '<div class="eyebrow">LateralShield · Mission Control</div><h1>Relatório de avaliação</h1>'
          + [['Organização', m.organizacao], ['Ambiente', m.ambiente], ['Responsável pela avaliação', m.responsavel], ['Início da avaliação', dataBR(m.inicio)], ['Relatório gerado em', new Date().toLocaleString('pt-BR')], ['Observações', m.observacoes]]
            .filter(x => x[1]).map(x => '<p><b>' + x[0] + ':</b> ' + esc(x[1]) + '</p>').join('')
          + '<p class="muted">Os controles do catálogo estão em rascunho e ainda não passaram por validação em laboratório. Este relatório mostra onde o ambiente é mais frágil: guarde-o com acesso restrito.</p>';
        h += '<h2>Resumo</h2>' + tabela(['Tecnologia', 'Controles', 'Não avaliados', 'Expostos', 'Em implantação', 'Aplicados', 'Não se aplicam'], D.tecnologias.map(t => {
          const x = c.tec[t.id] || {};
          return [esc(t.nome), Object.values(x).reduce((a, b) => a + b, 0), x['nao-avaliado'] || 0, x.exposto || 0, x['em-implantacao'] || 0, x.aplicado || 0, x['nao-se-aplica'] || 0];
        }));
        h += '<p>Perguntas de processo: ' + (c.processo.sim || 0) + ' "sim", ' + (c.processo.parcial || 0) + ' "parcial", ' + (c.processo.nao || 0) + ' "não" e ' + (c.processo['sem-resposta'] || 0) + ' sem resposta. As respostas não são somadas.</p>';
        h += '<h2>Primeira verificação: os logs saem do servidor?</h2>' + tabela(['Camada', 'Controle', 'Título', 'Situação'], D.logs.map(l => [esc(l.camada), l.id, esc(CONTROLE[l.id].titulo), st(l.id)]));
        h += '<h2>Plano de ação</h2>' + (gaps.length ? tabela(['Item', 'Lacuna', 'Situação', 'Pri.', 'Responsável', 'Prazo'], gaps.map(g => [esc(g.rotulo), esc(g.descricao) + (g.it.nota ? '<br><i>' + esc(g.it.nota) + '</i>' : ''), pill(g.it.status, ROT[g.it.status]), g.prioridade, esc(g.it.responsavel) || 'sem responsável', dataBR(g.it.prazo) + (vencido(g.it) ? ' (vencido)' : '')])) : '<p>Nenhuma lacuna registrada até o momento.</p>');
        D.tecnologias.forEach(t => {
          h += '<h2>Controles · ' + esc(t.nome) + '</h2>' + tabela(['Controle', 'Título', 'Pilar', 'Pri.', 'Situação', 'Responsável', 'Prazo'], D.controles.filter(x => x.tecnologia === t.id).map(x => {
            const it = item(x.id);
            return [x.id, esc(x.titulo) + (it.nota ? '<br><i>' + esc(it.nota) + '</i>' : ''), maiuscula(x.pilar), x.prioridade, st(x.id), esc(it.responsavel), dataBR(it.prazo)];
          }));
        });
        h += '<h2>Avaliação básica de processos</h2>' + tabela(['#', 'Pergunta', 'Resposta', 'Evidência e observações', 'Responsável', 'Prazo'], Object.values(PERGUNTA).map(p => {
          const it = item(p.id);
          return [p.n, esc(p.pergunta), st(p.id), esc(it.nota), esc(it.responsavel), dataBR(it.prazo)];
        }));
        $('#impressao').innerHTML = h;
        window.print();
      }

      function baixar(nome, tipo, conteudo) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
        a.download = nome;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      }
      function csv() {
        // Valores que começam com =, +, - ou @ recebem um apóstrofo para não serem lidos como fórmula.
        const cel = v => { let s = String(v == null ? '' : v); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
        const linhas = [['Tipo', 'Item', 'Descrição', 'Tecnologia ou bloco', 'Pilar', 'Prioridade', 'Situação', 'Responsável', 'Prazo', 'Evidência e observações', 'Atualizado em (UTC)']];
        D.controles.forEach(c => { const it = item(c.id); linhas.push(['Controle', c.id, c.titulo, TEC[c.tecnologia].nome, c.pilar, c.prioridade, ROT[it.status], it.responsavel, dataBR(it.prazo), it.nota, it.atualizado_em]); });
        D.processos.blocos.forEach(b => b.perguntas.forEach(p => { const it = item(p.id); linhas.push(['Processo', 'Pergunta ' + p.n, p.pergunta, b.nome, '', '', ROT[it.status], it.responsavel, dataBR(it.prazo), it.nota, it.atualizado_em]); }));
        baixar('lateralshield-avaliacao-' + hoje() + '.csv', 'text/csv;charset=utf-8', '﻿' + linhas.map(l => l.map(cel).join(';')).join('\r\n') + '\r\n');
      }
      async function importar(arquivo) {
        let j;
        try { j = JSON.parse(await arquivo.text()); } catch (e) { alert('O arquivo não é um JSON válido.'); return; }
        if (!j || typeof j.itens !== 'object') { alert('O arquivo não parece uma exportação do Mission Control.'); return; }
        if (!confirm('Importar substitui todas as respostas atuais. Continuar?')) return;
        if (modo === 'servidor') {
          try {
            const r = await api('POST', 'importar', { meta: j.meta || {}, itens: j.itens });
            const e = await api('GET', 'estado');
            E.meta = e.meta || {}; E.itens = e.itens || {};
            marcar(true, r.importados + ' itens importados' + (r.ignorados ? ', ' + r.ignorados + ' ignorados' : ''));
          } catch (e) { alert('Não foi possível importar: ' + e.message); return; }
        } else {
          E.meta = j.meta || {}; E.itens = {};
          Object.keys(j.itens).forEach(id => { if (TIPO[id] && SITUACOES[TIPO[id]].includes(j.itens[id].status)) E.itens[id] = j.itens[id]; });
          marcar(gravarLocal(), Object.keys(E.itens).length + ' itens importados');
        }
        navegar();
      }

      // ---------------------------------------------------------------- senha
      function abrirSenha(obrigatoria) {
        trocaObrigatoria = obrigatoria;
        $('#pw-t').textContent = obrigatoria ? 'Defina uma nova senha' : 'Trocar a senha';
        $('#pw-d').textContent = obrigatoria
          ? 'Este é o primeiro acesso com a senha inicial. Antes de continuar, escolha uma senha com pelo menos ' + senhaMinima + ' caracteres.'
          : 'A nova senha precisa ter pelo menos ' + senhaMinima + ' caracteres.';
        $('#pw-cancelar').style.display = obrigatoria ? 'none' : '';
        $('#pw').reset();
        $('#pw-usuario').value = usuario;
        $('#pw-err').textContent = '';
        $('#veu').classList.add('on');
        $('#pw-atual').focus();
      }
      // Faz o navegador passar a usar a nova senha, sem pedir de novo ao usuário.
      function reautenticar(senha) {
        return new Promise(resolver => {
          const x = new XMLHttpRequest();
          x.open('GET', API + 'estado', true, usuario, senha);
          x.onloadend = () => resolver(x.status === 200);
          x.send();
        });
      }
      async function trocarSenha(ev) {
        ev.preventDefault();
        const atual = $('#pw-atual').value, nova = $('#pw-nova').value;
        if (nova !== $('#pw-rep').value) { $('#pw-err').textContent = 'As duas senhas novas são diferentes.'; return; }
        try {
          await api('POST', 'senha', { atual: atual, nova: nova });
        } catch (e) { $('#pw-err').textContent = e.message; return; }
        await reautenticar(nova);
        location.reload();
      }

      // ---------------------------------------------------------------- eventos
      document.addEventListener('click', ev => {
        const alvo = ev.target;
        const filtro = alvo.closest('[data-filtro]');
        if (filtro) { F[filtro.dataset.filtro] = filtro.dataset.valor; controles(); return; }
        const tec = alvo.closest('[data-tec]');
        if (tec) { F.tec = tec.dataset.tec; F.pilar = F.pri = F.st = F.q = ''; }
        const pri = alvo.closest('[data-pri]');
        if (pri) { F.pri = pri.dataset.pri; F.tec = F.pilar = F.st = F.q = ''; }
        const sim = alvo.closest('[data-sim]');
        if (sim) { SIM = +sim.dataset.sim; topologia(); return; }
        const cam = alvo.closest('[data-caminho]');
        if (cam && !alvo.closest('a')) { selecionarCaminho(+cam.dataset.caminho, !!alvo.closest('svg')); return; }
        const acao = alvo.closest('[data-acao]');
        if (acao) {
          const a = acao.dataset.acao;
          if (a === 'imprimir') imprimir();
          if (a === 'csv') csv();
          if (a === 'exportar') baixar('lateralshield-avaliacao-' + hoje() + '.json', 'application/json', JSON.stringify({ formato: 'lateralshield-mission-control', versao: 1, exportado_em: agoraUTC(), meta: E.meta, itens: E.itens }, null, 1));
          if (a === 'importar') $('#arquivo').click();
          if (a === 'senha') abrirSenha(false);
          if (a === 'pausar') {
            pausado = !pausado;
            const svg = $('#tp-svg svg');
            if (svg && svg.pauseAnimations) { if (pausado) svg.pauseAnimations(); else svg.unpauseAnimations(); }
            acao.textContent = pausado ? 'Retomar a animação' : 'Pausar a animação';
          }
          if (a === 'apagar' && confirm('Apagar todas as respostas guardadas neste navegador?')) { E.meta = {}; E.itens = {}; marcar(gravarLocal(), 'Dados apagados'); navegar(); }
          return;
        }
        const cab = alvo.closest('.it .hd');
        if (cab && !alvo.closest('select')) {
          const id = cab.parentNode.dataset.id;
          if (abertos.has(id)) abertos.delete(id); else abertos.add(id);
          redesenharLinha(id);
        }
      });
      document.addEventListener('change', ev => {
        const alvo = ev.target;
        if (alvo.id === 'arquivo') { if (alvo.files[0]) importar(alvo.files[0]); alvo.value = ''; return; }
        if (alvo.dataset.meta) { salvarMeta(alvo.dataset.meta, alvo.value.trim()); return; }
        const linhaEl = alvo.closest('.it');
        if (alvo.dataset.campo && linhaEl) {
          const id = linhaEl.dataset.id, campo = alvo.dataset.campo;
          salvarItem(id, { [campo]: alvo.value.trim() }).then(() => {
            atualizarLinha(id);
            if ($('#s-topologia').classList.contains('on')) desenharTopologia();
          });
        }
      });
      document.addEventListener('input', ev => {
        if (ev.target.id === 'q') { F.q = ev.target.value; listaControles(); }
      });
      document.addEventListener('keydown', ev => {
        const cam = ev.target.closest && ev.target.closest('g[data-caminho]');
        if (cam && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); selecionarCaminho(+cam.dataset.caminho, true); }
      });
      // Dica flutuante dos gráficos e da topologia: qualquer elemento com data-tip.
      const tip = $('#tip');
      function mostrarDica(el, x, y) {
        tip.textContent = el.dataset.tip;
        tip.style.display = 'block';
        const l = tip.offsetWidth, a = tip.offsetHeight;
        tip.style.left = Math.max(8, Math.min(x + 14, window.innerWidth - l - 8)) + 'px';
        tip.style.top = (y + a + 26 > window.innerHeight ? y - a - 12 : y + 18) + 'px';
      }
      document.addEventListener('mousemove', ev => {
        const el = ev.target.closest && ev.target.closest('[data-tip]');
        if (el) mostrarDica(el, ev.clientX, ev.clientY); else tip.style.display = 'none';
      });
      document.addEventListener('focusin', ev => {
        const el = ev.target.closest && ev.target.closest('[data-tip]');
        if (el) { const r = el.getBoundingClientRect(); mostrarDica(el, r.left + r.width / 2, r.bottom - 8); }
      });
      document.addEventListener('focusout', () => { tip.style.display = 'none'; });
      document.addEventListener('scroll', () => { tip.style.display = 'none'; }, true);
      $('#pw').addEventListener('submit', trocarSenha);
      $('#pw-cancelar').addEventListener('click', () => $('#veu').classList.remove('on'));
      window.addEventListener('hashchange', navegar);

      // ---------------------------------------------------------------- início
      // A página veio de um servidor, mas a API falhou: não cai em modo local, para ninguém registrar respostas no lugar errado.
      function indisponivel(mensagem) {
        modo = 'servidor';
        $('#s-visao').classList.add('on');
        $('#s-visao').innerHTML = cabecalho('Mission Control', 'Servidor <em>indisponível</em>', esc(mensagem) + ' Recarregue a página em instantes. Nada foi alterado.');
      }
      async function iniciar() {
        if (location.protocol !== 'file:') {
          try {
            const r = await fetch(API + 'estado', { headers: { Accept: 'application/json' }, credentials: 'same-origin' });
            if ((r.headers.get('content-type') || '').includes('json')) {
              const j = await r.json();
              if (!r.ok) { indisponivel(j.mensagem || ('Erro ' + r.status)); return; }
