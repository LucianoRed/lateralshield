<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Control · LateralShield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&family=Red+Hat+Text:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --rh-red:#EE0000;--rh-red-dark:#B30000;--ink:#151515;--g700:#4A4A4A;--g400:#8A8A8A;--g300:#D2D2D2;--g100:#F5F5F5;--bg:#FFFFFF;
    --teal:#1A7A75;--teal-bg:#E6F4F3;--teal-bd:#BFE3E1;--amber:#9A6B00;--amber-bg:#FFF7E6;--amber-bd:#F0DCA8;--blue:#1D5FA8;--blue-bg:#EAF2FC;--blue-bd:#BFD6F2;
    --red-bg:#FFF1F1;--red-bd:#FFD9D9;--sb:264px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none !important}
  html,body{height:100%}
  body{font-family:'Red Hat Text',system-ui,sans-serif;color:var(--ink);background:var(--g100);font-size:14.5px;line-height:1.5}
  a{color:var(--rh-red-dark)}
  h1,h2,h3,h4{font-family:'Red Hat Display',system-ui,sans-serif;font-weight:700;line-height:1.2}
  code,.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
  code{background:var(--g100);border:1px solid #E6E6E6;border-radius:4px;padding:0 4px}

  /* ---- menu lateral ---- */
  .sb{position:fixed;left:0;top:0;bottom:0;width:var(--sb);background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:22px 18px;z-index:10}
  .sb .brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .sb .brand svg{width:34px;height:38px;flex:none}
  .sb .brand b{display:block;font-family:'Red Hat Display',sans-serif;font-weight:900;font-size:19px;letter-spacing:-.3px}
  .sb .brand .mc{font-family:'Red Hat Display',sans-serif;font-weight:900;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#FF8A8A}
  .sb .proj{font-size:12px;color:#B9C4CE;margin:8px 0 18px;line-height:1.4;min-height:17px}
  .sb nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
  .sb nav a{display:flex;align-items:center;gap:10px;color:#D2D2D2;text-decoration:none;font-size:14px;font-weight:500;padding:9px 12px;border-radius:8px;border-left:3px solid transparent;transition:background .15s,color .15s}
  .sb nav a:hover{background:#2a2a2a;color:#fff}
  .sb nav a.on{background:#2a2a2a;color:#fff;border-left-color:var(--rh-red)}
  .sb nav a .cnt{margin-left:auto;font-size:11px;font-weight:700;background:#3a3a3a;color:#fff;border-radius:999px;padding:1px 8px}
  .sb nav a .cnt.hot{background:var(--rh-red)}
  .sb .foot{font-size:11px;color:#8A8A8A;line-height:1.55;padding-top:14px;border-top:1px solid #333}
  .sb .foot b{color:#D2D2D2}
  .sb .foot .ok{color:#7FD1CB}.sb .foot .bad{color:#FF8A8A}

  /* ---- conteúdo ---- */
  main{margin-left:var(--sb);min-height:100vh;padding:34px 40px 60px}
  .sec{display:none;max-width:1240px}
  .sec.on{display:block}
  .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--rh-red);margin-bottom:8px}
  h1.t{font-size:32px;font-weight:900;margin-bottom:6px}
  h1.t em{font-style:normal;color:var(--rh-red)}
  .lead{font-size:15.5px;color:var(--g700);max-width:880px;margin-bottom:22px}
  .card{background:var(--bg);border:1px solid var(--g300);border-radius:14px;padding:18px 20px;position:relative;overflow:hidden}
  .card.mark::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rh-red)}
  .card h3{font-size:15px;margin-bottom:10px}
  .card p.sub{font-size:13px;color:var(--g700);margin:-4px 0 12px}
  .grid{display:grid;gap:16px;margin-bottom:16px}
  .g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
  .kpi{background:var(--bg);border:1px solid var(--g300);border-radius:14px;padding:16px 18px}
  .kpi .l{font-size:11.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--g400)}
  .kpi .v{font-family:'Red Hat Display',sans-serif;font-size:34px;font-weight:900;line-height:1.1;margin:6px 0 2px}
  .kpi .v small{font-size:17px;color:var(--g400);font-weight:700}
  .kpi .v.red{color:var(--rh-red)}.kpi .v.teal{color:var(--teal)}.kpi .v.amber{color:var(--amber)}
  .kpi .s{font-size:12.5px;color:var(--g700)}
  .muted{color:var(--g400);font-size:12.5px}
  .aviso{background:var(--amber-bg);border:1px solid var(--amber-bd);color:#5C4000;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px}

  .pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;border-radius:999px;padding:3px 9px;border:1px solid var(--g300);white-space:nowrap;vertical-align:middle;color:#6E6E6E;background:#F5F5F5}
  .pill.exposto,.pill.nao,.pill.late{color:var(--rh-red-dark);background:var(--red-bg);border-color:var(--red-bd)}
  .pill.em-implantacao,.pill.conter{color:var(--blue);background:var(--blue-bg);border-color:var(--blue-bd)}
  .pill.aplicado,.pill.sim,.pill.detectar{color:var(--teal);background:var(--teal-bg);border-color:var(--teal-bd)}
  .pill.parcial,.pill.prevenir{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-bd)}
  .pill.p1{color:#fff;background:var(--ink);border-color:var(--ink)}
  .pill.nao-se-aplica{border-style:dashed}

  table.t{width:100%;border-collapse:collapse;background:var(--bg);border:1px solid var(--g300);border-radius:14px;overflow:hidden}
  table.t th{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--g400);text-align:left;padding:10px 12px;background:var(--g100);border-bottom:1px solid var(--g300)}
  table.t td{padding:10px 12px;border-top:1px solid #ECECEC;vertical-align:top;font-size:13.5px}
  table.t tr:first-child td{border-top:0}
  table.t td.id{font-family:ui-monospace,Menlo,monospace;font-weight:700;white-space:nowrap;font-size:12.5px}
  table.t td.n{text-align:center;font-variant-numeric:tabular-nums}
  table.t td.nw{white-space:nowrap}
  table.t a{text-decoration:none;font-weight:700}
  .tw{overflow-x:auto;border-radius:14px}
  .due{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;color:var(--g700)}
  .due.late{color:var(--rh-red-dark)}

  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
  .bar .lb{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--g400);min-width:92px}
  .chip{font:inherit;font-size:12px;font-weight:700;border:1.5px solid var(--g300);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--g700);user-select:none}
  .chip:hover{border-color:var(--g400)}
  .chip.on{border-color:var(--rh-red);color:var(--rh-red-dark);background:var(--red-bg)}
  .chip small{font-weight:500;color:var(--g400);margin-left:4px}
  input.q{border:1.5px solid var(--g300);border-radius:999px;padding:6px 14px;font:inherit;font-size:13px;min-width:240px;margin-left:auto}
  input.q:focus{outline:none;border-color:var(--rh-red)}
  .btn{font:inherit;font-size:13px;font-weight:700;border:1.5px solid var(--g300);background:#fff;border-radius:999px;padding:8px 16px;cursor:pointer;color:var(--g700);text-decoration:none;display:inline-block}
  .btn:hover{border-color:var(--rh-red);color:var(--rh-red-dark)}
  .btn.pri{background:var(--rh-red);border-color:var(--rh-red);color:#fff}
  .btn.pri:hover{background:var(--rh-red-dark);border-color:var(--rh-red-dark);color:#fff}
  .btns{display:flex;flex-wrap:wrap;gap:10px}

  /* ---- itens do checklist ---- */
  .grp{font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--g700);margin:22px 0 4px}
  .grp small{font-weight:500;letter-spacing:0;text-transform:none;color:var(--g400);font-size:13px;margin-left:8px}
  .grpsub{font-size:13.5px;color:var(--g700);margin-bottom:8px}
  .it{background:#fff;border:1px solid var(--g300);border-left:4px solid var(--g300);border-radius:10px;margin-top:6px}
  .it.exposto,.it.nao{border-left-color:var(--rh-red)}
  .it.em-implantacao{border-left-color:var(--blue)}
  .it.aplicado,.it.sim{border-left-color:var(--teal)}
  .it.parcial{border-left-color:#D9A100}
  .it .hd{display:grid;grid-template-columns:108px 1fr 168px 20px;gap:12px;align-items:center;padding:9px 14px;cursor:pointer}
  .it .hd .id{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:12.5px;white-space:nowrap}
  .it .hd .ti{font-size:13.5px;font-weight:500}
  .it .hd .ti .pill{margin-left:6px}
  .it .hd .chev{color:var(--g400);transition:transform .15s;font-size:12px}
  .it.open .hd .chev{transform:rotate(180deg)}
  .it .dono{display:block;font-size:12px;color:var(--g700);font-weight:400;margin-top:2px}
  .it .dono:empty{display:none}
  select.st{font:inherit;font-size:12.5px;font-weight:700;border:1.5px solid var(--g300);border-radius:999px;padding:5px 10px;background:#fff;color:var(--g700);cursor:pointer;width:100%}
  select.st.exposto,select.st.nao{color:var(--rh-red-dark);background:var(--red-bg);border-color:var(--red-bd)}
  select.st.em-implantacao{color:var(--blue);background:var(--blue-bg);border-color:var(--blue-bd)}
  select.st.aplicado,select.st.sim{color:var(--teal);background:var(--teal-bg);border-color:var(--teal-bd)}
  select.st.parcial{color:var(--amber);background:var(--amber-bg);border-color:var(--amber-bd)}
  .it .bd{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:24px;padding:6px 16px 18px;border-top:1px solid #ECECEC}
  .it .bd h4{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--g400);margin:14px 0 5px}
  .it .bd p,.it .bd li{font-size:13.5px;color:#2b2b2b}
  .it .bd p{margin-bottom:8px}
  .it .bd ul{margin:0 0 8px 18px}
  .it .bd li{margin-bottom:3px}
  pre.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;background:var(--g100);border:1px solid var(--g300);border-radius:10px;padding:10px 12px;overflow:auto;margin:0 0 8px;white-space:pre}
  .form label{display:block;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--g400);margin-top:14px}
  .form input,.form textarea,.meta input,.meta textarea,.pw input{display:block;width:100%;margin-top:5px;font:inherit;font-size:13.5px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--ink);border:1.5px solid var(--g300);border-radius:8px;padding:7px 10px;background:#fff}
  .form textarea{min-height:110px;resize:vertical}
  .form input:focus,.form textarea:focus,.meta input:focus,.meta textarea:focus,.pw input:focus{outline:none;border-color:var(--rh-red)}
  .form .muted{margin-top:10px}
  .meta{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .meta label,.pw label{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--g400)}
  .meta .wide{grid-column:1/-1}

  /* ---- visão geral ---- */
  .stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--g100);min-width:140px}
  .stack i{display:block;height:100%}
  .stack .exposto{background:var(--rh-red)}.stack .em-implantacao{background:#3B82C4}.stack .aplicado{background:var(--teal)}.stack .nao-se-aplica{background:#B8B8B8}
  ul.lst{list-style:none;display:grid;gap:8px}
  ul.lst li{display:flex;gap:10px;align-items:baseline;font-size:13.5px}
  ul.lst li .id{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:12px;min-width:98px;text-decoration:none}
  ul.lst li .x{flex:1}
  .leg{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--g700);margin-top:12px}
  .leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

  /* ---- matriz 80/20 ---- */
  .mx{display:grid;grid-template-columns:120px repeat(3,1fr);gap:10px}
  .mx .ax{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--g400);display:flex;align-items:center;justify-content:center;text-align:center}
  .mx .ax.row{justify-content:flex-end;text-align:right;padding-right:6px}
  .mx .cell{background:#fff;border:1px solid var(--g300);border-radius:12px;padding:12px 14px;min-height:112px}
  .mx .cell.off{background:#FAFAFA;border-style:dashed}
  .mx .cell h4{font-size:13px;margin-bottom:8px}
  .mx .cell.p1 h4{color:var(--rh-red-dark)}
  .mx .cell.off h4{color:var(--g400);font-weight:500}
  .cid{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;margin:0 4px 5px 0;border:1px solid var(--g300);background:#fff;color:var(--g700);text-decoration:none}
  .cid.exposto{color:var(--rh-red-dark);background:var(--red-bg);border-color:var(--red-bd)}
  .cid.em-implantacao{color:var(--blue);background:var(--blue-bg);border-color:var(--blue-bd)}
  .cid.aplicado{color:var(--teal);background:var(--teal-bg);border-color:var(--teal-bd)}
  .cid.nao-se-aplica{color:var(--g400);border-style:dashed}

  /* ---- modal de senha ---- */
  .veu{position:fixed;inset:0;background:rgba(21,21,21,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .veu.on{display:flex}
  .pw{background:#fff;border-radius:16px;padding:26px 28px;width:100%;max-width:440px}
  .pw h2{font-size:22px;font-weight:900;margin-bottom:6px}
  .pw p{font-size:13.5px;color:var(--g700);margin-bottom:6px}
  .pw label{display:block;margin-top:14px}
  .pw .err{color:var(--rh-red-dark);font-size:13px;font-weight:700;min-height:20px;margin-top:12px}
  .pw .btns{margin-top:8px;justify-content:flex-end}

  #impressao{display:none}
  @media (max-width:1000px){
    .sb{position:static;width:auto;padding:14px 16px}
    .sb nav{flex-direction:row;flex-wrap:wrap}
    .sb .foot{display:none}
    main{margin-left:0;padding:22px 16px 50px}
    .g2,.g4,.meta{grid-template-columns:1fr 1fr}
    .it .hd{grid-template-columns:1fr 150px 16px}
    .it .hd .id{grid-column:1/-1}
    .it .bd{grid-template-columns:1fr}
    .mx{grid-template-columns:70px repeat(3,minmax(150px,1fr));overflow-x:auto}
  }
  @media print{
    @page{size:A4;margin:14mm}
    body{background:#fff;font-size:10.5px}
    .sb,main,.veu{display:none !important}
    #impressao{display:block}
    #impressao h1{font-size:22px;margin-bottom:4px}
    #impressao h2{font-size:14px;margin:18px 0 6px;padding-bottom:3px;border-bottom:2px solid var(--rh-red)}
    #impressao p{margin-bottom:4px}
    #impressao table{width:100%;border-collapse:collapse;margin-bottom:8px}
    #impressao th{font-size:8.5px;letter-spacing:1px;text-transform:uppercase;text-align:left;background:#EEE;padding:4px 6px}
    #impressao td{padding:4px 6px;border-bottom:1px solid #DDD;vertical-align:top}
    #impressao tr{break-inside:avoid}
    #impressao .pill{font-size:8px;padding:1px 6px}
  }
</style>
</head>
<body>

<aside class="sb">
  <div class="brand">
    <svg viewBox="0 0 34 38" aria-hidden="true"><path d="M17 1 32 6v11c0 9.6-6.2 16.300-15 20C8.200 33.300 2 26.600 2 17V6z" fill="#EE0000"/><path d="M11 12v14h12v-3.400h-8V12z" fill="#fff"/></svg>
    <div><b>LateralShield</b><span class="mc">Mission Control</span></div>
  </div>
  <div class="proj" id="sb-proj"></div>
  <nav id="nav"></nav>
  <div class="foot" id="sb-foot"></div>
</aside>

<main>
  <section class="sec" id="s-visao"></section>
  <section class="sec" id="s-controles"></section>
  <section class="sec" id="s-prioridades"></section>
  <section class="sec" id="s-processos"></section>
  <section class="sec" id="s-plano"></section>
  <section class="sec" id="s-incidentes"></section>
  <section class="sec" id="s-relatorio"></section>
</main>

<div class="veu" id="veu">
  <form class="pw" id="pw" autocomplete="off">
    <h2 id="pw-t">Trocar a senha</h2>
    <p id="pw-d"></p>
    <input type="text" id="pw-usuario" autocomplete="username" hidden>
    <label>Senha atual<input type="password" id="pw-atual" autocomplete="current-password" required></label>
    <label>Nova senha<input type="password" id="pw-nova" autocomplete="new-password" required></label>
    <label>Repita a nova senha<input type="password" id="pw-rep" autocomplete="new-password" required></label>
    <div class="err" id="pw-err"></div>
    <div class="btns">
      <button type="button" class="btn" id="pw-cancelar">Cancelar</button>
      <button type="submit" class="btn pri">Salvar a nova senha</button>
    </div>
  </form>
</div>

<div id="impressao"></div>

<script src="data.js"></script>
<script>
(function () {
  'use strict';
  const D = window.LS_DADOS;
  const $ = (s, el) => (el || document).querySelector(s);
  const ROT = {
    'nao-avaliado': 'Não avaliado', 'exposto': 'Exposto', 'em-implantacao': 'Em implantação', 'aplicado': 'Aplicado',
    'nao-se-aplica': 'Não se aplica', 'sem-resposta': 'Sem resposta', 'sim': 'Sim', 'parcial': 'Parcial', 'nao': 'Não'
  };
  const SITUACOES = {
    controle: ['nao-avaliado', 'exposto', 'em-implantacao', 'aplicado', 'nao-se-aplica'],
    processo: ['sem-resposta', 'sim', 'parcial', 'nao']
  };
  const LACUNA = ['exposto', 'em-implantacao', 'nao', 'parcial'];
  const SECOES = [
    ['visao', 'Visão geral'], ['controles', 'Controles'], ['prioridades', 'Matriz 80/20'], ['processos', 'Processos'],
    ['plano', 'Plano de ação'], ['incidentes', 'Incidentes'], ['relatorio', 'Relatório e dados']
  ];
  const CHAVE = 'lateralshield-mission-control-v1';
  const BASE = location.protocol === 'file:' ? '../../' : D.repositorio + '/blob/main/';
  // Endereço absoluto da API, sem usuário e senha, mesmo que a página tenha sido aberta com eles no endereço.
  const API = location.origin + location.pathname.replace(/[^/]*$/, '') + 'api/';

  const E = { meta: {}, itens: {} };
  let modo = 'local', usuario = '', senhaMinima = 10, salvo = null, trocaObrigatoria = false;
  const F = { tec: '', pilar: '', pri: '', st: '', q: '' };
  const abertos = new Set();

  const CONTROLE = {}, PERGUNTA = {}, TIPO = {};
  D.controles.forEach(c => { CONTROLE[c.id] = c; TIPO[c.id] = 'controle'; });
  D.processos.blocos.forEach(b => b.perguntas.forEach(p => { PERGUNTA[p.id] = p; TIPO[p.id] = 'processo'; }));
  const TEC = {};
  D.tecnologias.forEach(t => { TEC[t.id] = t; });

  // ---------------------------------------------------------------- utilitários
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const hoje = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  const dataBR = iso => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; };
  const pill = (classe, texto) => '<span class="pill ' + classe + '">' + esc(texto) + '</span>';
  const maiuscula = s => s.charAt(0).toUpperCase() + s.slice(1);

  function item(id) {
    const padrao = { status: SITUACOES[TIPO[id]][0], responsavel: '', prazo: '', nota: '', atualizado_em: '', atualizado_por: '' };
    return Object.assign(padrao, E.itens[id] || {});
  }
  const vencido = it => !!it.prazo && it.prazo < hoje() && LACUNA.includes(it.status);

  function destino(url) {
    if (/^https?:\/\//.test(url)) return { href: url, externo: true };
    const m = /^catalogo\/[a-z-]+\/(LS-[A-Z]+-\d{3})-/.exec(url);
    if (m && CONTROLE[m[1]]) return { href: '#controles/' + m[1] };
    if (/^[a-z][a-z0-9+.-]*:/i.test(url)) return null;
    return { href: BASE + url, externo: true };
  }
  function link(url, textoHtml, arquivo) {
    const d = arquivo ? { href: BASE + url, externo: true } : destino(url);
    if (!d) return textoHtml;
    return '<a href="' + d.href + '"' + (d.externo ? ' target="_blank" rel="noopener"' : '') + '>' + textoHtml + '</a>';
  }

  // Markdown mínimo: parágrafos, listas, tabelas, blocos de código, `código`, **negrito**, *itálico* e links.
  function emLinha(texto) {
    const codigos = [];
    let s = esc(texto).replace(/`([^`]+)`/g, (m, c) => { codigos.push(c); return '\u0001' + (codigos.length - 1) + '\u0001'; });
    s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\*([^*\s][^*]*)\*/g, '<i>$1</i>');
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => link(u, t));
    return s.replace(/\u0001(\d+)\u0001/g, (m, n) => '<code>' + codigos[+n] + '</code>');
  }
  function md(texto) {
    let html = '';
    String(texto || '').split(/```[a-z]*\n([\s\S]*?)```/).forEach((parte, i) => {
      if (i % 2) { html += '<pre class="code">' + esc(parte.replace(/\n$/, '')) + '</pre>'; return; }
      parte.split(/\n{2,}/).forEach(bloco => {
        const linhas = bloco.split('\n').filter(l => l.trim() !== '');
        if (!linhas.length) return;
        if (linhas.every(l => l.trim().startsWith('|'))) {
          const corpo = linhas.filter(l => !/^\s*\|\s*-/.test(l)).map(l => l.trim().replace(/^\||\|$/g, '').split('|'));
          html += '<div class="tw"><table class="t">' + corpo.map((cs, n) => '<tr>' + cs.map(c => (n ? '<td>' : '<th>') + emLinha(c.trim()) + (n ? '</td>' : '</th>')).join('') + '</tr>').join('') + '</table></div>';
        } else if (/^\s*[-*] /.test(linhas[0])) {
          const itens = [];
          linhas.forEach(l => { if (/^\s*[-*] /.test(l)) itens.push(l.replace(/^\s*[-*] /, '')); else itens[itens.length - 1] += ' ' + l.trim(); });
          html += '<ul>' + itens.map(x => '<li>' + emLinha(x) + '</li>').join('') + '</ul>';
        } else {
          html += '<p>' + emLinha(linhas.join(' ')) + '</p>';
        }
      });
    });
    return html;
  }

  // ---------------------------------------------------------------- persistência
  async function api(metodo, caminho, corpo) {
    const cabecalhos = { Accept: 'application/json' };
    if (metodo !== 'GET') { cabecalhos['Content-Type'] = 'application/json'; cabecalhos['X-Requested-With'] = 'LateralShield'; }
    const r = await fetch(API + caminho, { method: metodo, headers: cabecalhos, body: corpo ? JSON.stringify(corpo) : undefined, credentials: 'same-origin' });
    let j = null;
    try { j = await r.json(); } catch (e) { /* resposta sem JSON */ }
    if (!r.ok) {
      const erro = new Error((j && j.mensagem) || ('Erro ' + r.status));
      erro.status = r.status; erro.chave = j && j.erro;
      throw erro;
    }
    return j;
  }
  function gravarLocal() {
    try { localStorage.setItem(CHAVE, JSON.stringify({ meta: E.meta, itens: E.itens })); return true; } catch (e) { return false; }
  }
  function carregarLocal() {
    try {
      const j = JSON.parse(localStorage.getItem(CHAVE) || '{}');
      E.meta = j.meta || {}; E.itens = j.itens || {};
    } catch (e) { /* armazenamento indisponível: a página funciona sem guardar */ }
  }
  function marcar(ok, mensagem) {
    salvo = { ok: ok, texto: mensagem || (ok ? 'Salvo às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : 'Não foi possível salvar') };
    rodape();
  }
  const agoraUTC = () => new Date().toISOString().slice(0, 19).replace('T', ' ');

  async function salvarItem(id, campos) {
    const it = item(id);
    Object.assign(it, campos, { atualizado_em: agoraUTC(), atualizado_por: usuario || 'local' });
    E.itens[id] = it;
    if (modo === 'servidor') {
      try { E.itens[id] = (await api('PUT', 'item/' + id, it)).item; marcar(true); }
      catch (e) { marcar(false, e.status === 401 ? 'Sessão encerrada: recarregue a página' : e.message); }
    } else {
      marcar(gravarLocal());
    }
    menu();
  }
  async function salvarMeta(chave, valor) {
    E.meta[chave] = valor;
    if (modo === 'servidor') {
      try { E.meta = (await api('PUT', 'meta', { [chave]: valor })).meta || {}; marcar(true); }
      catch (e) { marcar(false, e.message); }
    } else {
      marcar(gravarLocal());
    }
    menu();
  }

  // ---------------------------------------------------------------- contagens
  function contar() {
    const c = { controle: {}, processo: {}, tec: {} };
    D.controles.forEach(x => {
      const s = item(x.id).status;
      c.controle[s] = (c.controle[s] || 0) + 1;
      c.tec[x.tecnologia] = c.tec[x.tecnologia] || {};
      c.tec[x.tecnologia][s] = (c.tec[x.tecnologia][s] || 0) + 1;
    });
    Object.keys(PERGUNTA).forEach(id => { const s = item(id).status; c.processo[s] = (c.processo[s] || 0) + 1; });
    return c;
  }
  function lacunas() {
    const lista = [];
    D.controles.forEach(c => {
      const it = item(c.id);
      if (LACUNA.includes(it.status)) lista.push({ id: c.id, rotulo: c.id, href: '#controles/' + c.id, descricao: c.titulo, prioridade: c.prioridade, it: it });
    });
    lista.sort((a, b) => a.prioridade - b.prioridade || a.id.localeCompare(b.id));
    Object.values(PERGUNTA).forEach(p => {
      const it = item(p.id);
      if (LACUNA.includes(it.status)) lista.push({ id: p.id, rotulo: 'Pergunta ' + p.n, href: '#processos/' + p.id, descricao: p.pergunta, prioridade: '', it: it });
    });
    return lista;
  }

  // ---------------------------------------------------------------- menu e rodapé
  function menu() {
    const c = contar(), n = lacunas().length;
    const lacunasProcesso = (c.processo.nao || 0) + (c.processo.parcial || 0);
    const numeros = { controles: [c.controle.exposto || 0, true], processos: [lacunasProcesso, true], plano: [n, false] };
    const atual = (location.hash.slice(1).split('/')[0]) || 'visao';
    $('#nav').innerHTML = SECOES.map(([id, nome]) => {
      const num = numeros[id];
      const cnt = num && num[0] ? '<span class="cnt' + (num[1] ? ' hot' : '') + '">' + num[0] + '</span>' : '';
      return '<a href="#' + id + '"' + (id === atual ? ' class="on"' : '') + '>' + nome + cnt + '</a>';
    }).join('');
    $('#sb-proj').textContent = [E.meta.organizacao, E.meta.ambiente].filter(Boolean).join(' · ') || 'Avaliação do ambiente';
  }
  function rodape() {
    const onde = modo === 'servidor'
      ? '<b>Servidor</b> · usuário ' + esc(usuario) + '<br>Respostas guardadas no banco de dados'
      : '<b>Modo local</b><br>Respostas guardadas só neste navegador';
    const estado = salvo ? '<br><span class="' + (salvo.ok ? 'ok' : 'bad') + '">' + esc(salvo.texto) + '</span>' : '';

  function textoDono(it) {

    : 'Ainda sem registro';
  function linha(id) {
    const it = item(id), aberto = abertos.has(id);

      const c = CONTROLE[id];
      titulo = '<span class="id">' + c.id + '</span><span class="ti">' + esc(c.titulo) + pill(c.pilar, c.pilar) + pill(c.prioridade === 1 ? 'p1' : '', 'P' + c.prioridade) + resumoDono(it) + '</span>';
      if (aberto) {
        corpo = '<div class="bd"><div>'
          + '<h4>Problema</h4>' + md(c.problema)
          + '<h4>Benefício</h4>' + md(c.beneficio)
          + '<h4>Como avaliar · somente leitura</h4>' + md(c.avaliacao)
          + '<p class="muted">' + link(c.arquivo, 'Abrir o controle completo', true) + ' · implementação, validação, reversão e detecção<br>'
          + esc(TEC[c.tecnologia].nome) + ' · ' + esc(c.versoes) + ' · impacto ' + c.impacto + ', esforço ' + c.esforco + ' · no catálogo: ' + c.status + '</p>'
          + '</div>' + formulario(id, it, 'Evidência e observações') + '</div>';
      }
    } else {
      const p = PERGUNTA[id];
      titulo = '<span class="id">Pergunta ' + p.n + '</span><span class="ti">' + esc(p.pergunta) + resumoDono(it) + '</span>';
      if (aberto) {
        corpo = '<div class="bd"><div>'
          + '<h4>O que conta como "sim"</h4>' + md(p.sim)
          + '<h4>Por que importa</h4>' + md(p.porque)
          + (p.primeiro_passo ? '<h4>Primeiro passo de baixo esforço</h4>' + md(p.primeiro_passo) : '')
          + '</div>' + formulario(id, it, 'Evidência e o que falta') + '</div>';
      }
    }
    return '<div class="it ' + it.status + (aberto ? ' open' : '') + '" data-id="' + id + '"><div class="hd">' + titulo + seletor(id, it) + '<span class="chev">&#9662;</span></div>' + corpo + '</div>';
  }
  function redesenharLinha(id) {
    document.querySelectorAll('.it[data-id="' + id + '"]').forEach(el => { el.outerHTML = linha(id); });
  }
  // Depois de salvar, atualiza só o cabeçalho da linha: o formulário aberto não perde o foco.
  function atualizarLinha(id) {
    const it = item(id);
    document.querySelectorAll('.it[data-id="' + id + '"]').forEach(el => {
      el.className = 'it ' + it.status + (abertos.has(id) ? ' open' : '');
      const sel = $('select.st', el), dono = $('.dono', el), quando = $('.quando', el);
      if (sel) sel.className = 'st ' + it.status;
      if (dono) dono.innerHTML = textoDono(it);
      if (quando) quando.textContent = textoQuando(it);
    });
    const st = contar().controle;
    document.querySelectorAll('.chip[data-filtro="st"]').forEach(chip => {
      const n = $('small', chip);
      if (n) n.textContent = st[chip.dataset.valor] || 0;

  }

  // ---------------------------------------------------------------- seções
  function cabecalho(olho, titulo, lead) {

  }

    const atrasados = gaps.filter(g => vencido(g.it));
    const m = E.meta;
    let h = cabecalho('Mission Control', 'Avaliação <em>do ambiente</em>', 'Assuma o comprometimento, contenha o impacto. Registre aqui a situação de cada controle e de cada pergunta de processo, e acompanhe o que falta fechar.');
    if (modo === 'local') h += '<div class="aviso"><b>Modo local.</b> As respostas ficam só neste navegador. Para guardar em banco de dados e gerar o relatório em PDF e Excel, instale o Mission Control no OpenShift (veja <a href="#relatorio">Relatório e dados</a>).</div>';

    h += '<div class="grid g4">'

      + '<div class="kpi"><div class="l">Expostos</div><div class="v red">' + (cc.exposto || 0) + '</div><div class="s">' + (cc['em-implantacao'] || 0) + ' em implantação</div></div>'

      + D.logs.map(l => '<li><a class="id" href="#controles/' + l.id + '">' + l.id + '</a><span class="x">' + esc(l.camada) + '</span>' + pill(item(l.id).status, ROT[item(l.id).status]) + '</li>').join('')
      + '</ul></div>';

  function filtrados() {

      const it = item(c.id);

        && (!F.st || it.status === F.st)

  function prioridades() {

    h += '<div class="mx"><div></div>' + niveis.esforco.map(e => '<div class="ax">Esforço ' + nome[e] + '</div>').join('');
    niveis.impacto.forEach(i => {
      h += '<div class="ax row">Impacto ' + nome[i] + '</div>';
      niveis.esforco.forEach(e => {
        const rot = faixa[i + '-' + e], lista = D.controles.filter(c => c.impacto === i && c.esforco === e);
        h += '<div class="cell' + (rot ? (rot === 'Prioridade 1' ? ' p1' : '') : ' off') + '"><h4>' + (rot || 'Fora do catálogo') + (lista.length ? ' · ' + lista.length : '') + '</h4>'
          + lista.map(c => '<a class="cid ' + item(c.id).status + '" href="#controles/' + c.id + '" title="' + esc(c.titulo) + ' · ' + ROT[item(c.id).status] + '">' + c.id + '</a>').join('') + '</div>';
      });
    });
    h += '</div><div class="leg"><span><a class="cid exposto">LS</a>Exposto</span><span><a class="cid em-implantacao">LS</a>Em implantação</span><span><a class="cid aplicado">LS</a>Aplicado</span><span><a class="cid nao-se-aplica">LS</a>Não se aplica</span><span><a class="cid">LS</a>Não avaliado</span></div>';
    $('#s-prioridades').innerHTML = h;
  }

  function processos() {
    let h = cabecalho('Pessoas e processos', 'Avaliação básica <em>de processos</em>', 'Quem sustenta os controles? São ' + Object.keys(PERGUNTA).length + ' perguntas para uma conversa com as equipes, com três respostas: sim, parcial ou não. "Sim" exige evidência: um nome, um documento, uma data.');
    h += '<div class="aviso">Não há nota nem nível de maturidade, e as respostas não são somadas. O resultado é uma lista curta de lacunas, cada uma com responsável e prazo. ' + link(D.processos.arquivo, 'Como conduzir a avaliação') + '.</div>';
    D.processos.blocos.forEach(b => {
      h += '<h3 class="grp">' + esc(b.nome) + '</h3><div class="grpsub">' + esc(b.central) + '</div>' + b.perguntas.map(p => linha(p.id)).join('');
    });
    $('#s-processos').innerHTML = h;
  }

  function plano() {
    const gaps = lacunas();
    let h = cabecalho('Resultado', 'Plano <em>de ação</em>', 'Controles expostos ou em implantação, por prioridade, e perguntas de processo com resposta "não" ou "parcial". Cada linha precisa de um responsável e de um prazo.');
    if (!gaps.length) {
      h += '<div class="card"><p class="sub" style="margin:0">Nenhuma lacuna registrada até o momento. Marque um controle como exposto ou responda "não" ou "parcial" a uma pergunta para que ele apareça aqui.</p></div>';
    } else {
      h += '<div class="tw"><table class="t"><tr><th>Item</th><th>Lacuna</th><th>Situação</th><th>Pri.</th><th>Responsável</th><th>Prazo</th></tr>'
        + gaps.map(g => '<tr><td class="id"><a href="' + g.href + '">' + esc(g.rotulo) + '</a></td><td>' + esc(g.descricao) + (g.it.nota ? '<div class="muted">' + esc(g.it.nota) + '</div>' : '') + '</td><td class="nw">' + pill(g.it.status, ROT[g.it.status]) + '</td><td class="n">' + g.prioridade + '</td><td>' + (g.it.responsavel ? esc(g.it.responsavel) : pill('late', 'sem responsável')) + '</td><td class="nw"><span class="due' + (vencido(g.it) ? ' late' : '') + '">' + (dataBR(g.it.prazo) || '&mdash;') + (vencido(g.it) ? ' · vencido' : '') + '</span></td></tr>').join('')
        + '</table></div>';
    }
    $('#s-plano').innerHTML = h;
  }

  function incidentes() {
    let h = cabecalho('Em crise', 'Recomendações <em>para incidentes</em>', 'Medidas de emergência para um incidente em andamento. Não são controles: toda medida tem dono, prazo e forma de desfazer. Algumas apenas reduzem o volume de ataque, e a tabela indica quais.');
    h += '<div class="tw"><table class="t"><tr><th>Recomendação</th><th>Efeito</th><th>Reduz ruído ou contém?</th></tr>'
      + D.incidentes.itens.map(i => '<tr><td>' + link(i.link, esc(i.titulo)) + '</td><td>' + esc(i.efeito) + '</td><td class="nw">' + (/cont/i.test(i.tipo) ? pill('aplicado', i.tipo) : /ru/i.test(i.tipo) ? pill('parcial', i.tipo) : '&mdash;') + '</td></tr>').join('')
      + '</table></div><p style="margin-top:14px">' + link(D.incidentes.arquivo, 'Abrir as recomendações completas') + ', com quando usar, o que fazer, cuidados e como desfazer.</p>';
    $('#s-incidentes').innerHTML = h;
  }

  function relatorio() {
    let h = cabecalho('Saída', 'Relatório <em>e dados</em>', 'O relatório reúne o resumo, a primeira verificação, o plano de ação e a situação de cada controle e de cada pergunta.');
    h += '<div class="aviso"><b>Trate o resultado como informação sensível.</b> A lista de lacunas mostra onde o ambiente é mais frágil: guarde o relatório com acesso restrito.</div>';
    h += '<div class="grid g2"><div class="card mark"><h3>Relatório</h3>';
    if (modo === 'servidor') {
      h += '<p class="sub">Gerado pelo servidor a partir do que está no banco de dados.</p><div class="btns"><a class="btn pri" href="' + API + 'relatorio.pdf">Baixar em PDF</a><a class="btn pri" href="' + API + 'relatorio.xlsx">Baixar em Excel (.xlsx)</a><button type="button" class="btn" data-acao="imprimir">Imprimir</button></div>';
    } else {
      h += '<p class="sub">No modo local, o PDF sai pela impressão do navegador ("Salvar como PDF") e a planilha em CSV. PDF e Excel prontos para baixar exigem a instalação em servidor.</p><div class="btns"><button type="button" class="btn pri" data-acao="imprimir">Imprimir ou salvar em PDF</button><button type="button" class="btn pri" data-acao="csv">Baixar planilha (.csv)</button></div>';
    }
    h += '</div><div class="card"><h3>Cópia dos dados</h3><p class="sub">O arquivo JSON leva a avaliação de um lugar para outro: de um navegador para o servidor, ou de um ambiente para outro. Importar <b>substitui</b> as respostas atuais.</p><div class="btns">'
      + (modo === 'servidor' ? '<a class="btn" href="' + API + 'exportar.json">Exportar JSON</a>' : '<button type="button" class="btn" data-acao="exportar">Exportar JSON</button>')
      + '<button type="button" class="btn" data-acao="importar">Importar JSON</button>'
      + (modo === 'local' ? '<button type="button" class="btn" data-acao="apagar">Apagar os dados deste navegador</button>' : '')
      + '<input type="file" id="arquivo" accept="application/json,.json" hidden></div></div></div>';
    if (modo === 'servidor') {
      h += '<div class="card"><h3>Acesso</h3><p class="sub">Autenticado como <b>' + esc(usuario) + '</b>. A senha fica guardada no banco na forma de hash.</p><button type="button" class="btn" data-acao="senha">Trocar a senha</button></div>';
    } else {
      h += '<div class="card"><h3>Instalar no OpenShift</h3><p class="sub">Crie o projeto e aplique o manifesto: ele instala o Mission Control e um banco MySQL, com autenticação. O usuário inicial é <code>admin</code>, a senha inicial é <code>redhat</code> e a troca é exigida no primeiro acesso.</p><pre class="code">oc new-project lateralshield\noc apply -f ' + esc(D.repositorio.replace('github.com', 'raw.githubusercontent.com')) + '/main/mission-control/openshift/mission-control.yaml\noc get route mission-control -n lateralshield</pre><p class="muted">' + link('mission-control/README.md', 'Instruções completas') + ', incluindo como executar em um contêiner local.</p></div>';
    }
    $('#s-relatorio').innerHTML = h;
  }

  const DESENHAR = { visao: visao, controles: controles, prioridades: prioridades, processos: processos, plano: plano, incidentes: incidentes, relatorio: relatorio };

  function navegar() {
    const partes = location.hash.slice(1).split('/');
    const secao = DESENHAR[partes[0]] ? partes[0] : 'visao';
    const alvo = partes[1];
    if (alvo && TIPO[alvo]) {
      abertos.add(alvo);
      if (TIPO[alvo] === 'controle') { F.tec = F.pilar = F.pri = F.st = F.q = ''; }
    }
    document.querySelectorAll('.sec').forEach(s => s.classList.toggle('on', s.id === 's-' + secao));
    DESENHAR[secao]();
    menu();
    const el = alvo && document.querySelector('#s-' + secao + ' .it[data-id="' + alvo + '"]');
    if (el) el.scrollIntoView({ block: 'start' }); else window.scrollTo(0, 0);
  }

  // ---------------------------------------------------------------- relatório no navegador
  function imprimir() {
    const m = E.meta, c = contar(), gaps = lacunas();
    const tabela = (cab, linhas) => '<table><tr>' + cab.map(x => '<th>' + x + '</th>').join('') + '</tr>' + linhas.map(l => '<tr>' + l.map(x => '<td>' + x + '</td>').join('') + '</tr>').join('') + '</table>';
    const st = id => pill(item(id).status, ROT[item(id).status]);
    let h = '<div class="eyebrow">LateralShield · Mission Control</div><h1>Relatório de avaliação</h1>'
      + [['Organização', m.organizacao], ['Ambiente', m.ambiente], ['Responsável pela avaliação', m.responsavel], ['Início da avaliação', dataBR(m.inicio)], ['Relatório gerado em', new Date().toLocaleString('pt-BR')], ['Observações', m.observacoes]]
        .filter(x => x[1]).map(x => '<p><b>' + x[0] + ':</b> ' + esc(x[1]) + '</p>').join('')
      + '<p class="muted">Os controles do catálogo estão em rascunho e ainda não passaram por validação em laboratório. Este relatório mostra onde o ambiente é mais frágil: guarde-o com acesso restrito.</p>';
    h += '<h2>Resumo</h2>' + tabela(['Tecnologia', 'Controles', 'Não avaliados', 'Expostos', 'Em implantação', 'Aplicados', 'Não se aplicam'], D.tecnologias.map(t => {
      const x = c.tec[t.id] || {};
      return [esc(t.nome), Object.values(x).reduce((a, b) => a + b, 0), x['nao-avaliado'] || 0, x.exposto || 0, x['em-implantacao'] || 0, x.aplicado || 0, x['nao-se-aplica'] || 0];
    }));
    h += '<p>Perguntas de processo: ' + (c.processo.sim || 0) + ' "sim", ' + (c.processo.parcial || 0) + ' "parcial", ' + (c.processo.nao || 0) + ' "não" e ' + (c.processo['sem-resposta'] || 0) + ' sem resposta. As respostas não são somadas.</p>';
    h += '<h2>Primeira verificação: os logs saem do servidor?</h2>' + tabela(['Camada', 'Controle', 'Título', 'Situação'], D.logs.map(l => [esc(l.camada), l.id, esc(CONTROLE[l.id].titulo), st(l.id)]));
    h += '<h2>Plano de ação</h2>' + (gaps.length ? tabela(['Item', 'Lacuna', 'Situação', 'Pri.', 'Responsável', 'Prazo'], gaps.map(g => [esc(g.rotulo), esc(g.descricao) + (g.it.nota ? '<br><i>' + esc(g.it.nota) + '</i>' : ''), pill(g.it.status, ROT[g.it.status]), g.prioridade, esc(g.it.responsavel) || 'sem responsável', dataBR(g.it.prazo) + (vencido(g.it) ? ' (vencido)' : '')])) : '<p>Nenhuma lacuna registrada até o momento.</p>');
    D.tecnologias.forEach(t => {
      h += '<h2>Controles · ' + esc(t.nome) + '</h2>' + tabela(['Controle', 'Título', 'Pilar', 'Pri.', 'Situação', 'Responsável', 'Prazo'], D.controles.filter(x => x.tecnologia === t.id).map(x => {
        const it = item(x.id);
        return [x.id, esc(x.titulo) + (it.nota ? '<br><i>' + esc(it.nota) + '</i>' : ''), maiuscula(x.pilar), x.prioridade, st(x.id), esc(it.responsavel), dataBR(it.prazo)];
      }));
    });
    h += '<h2>Avaliação básica de processos</h2>' + tabela(['#', 'Pergunta', 'Resposta', 'Evidência e observações', 'Responsável', 'Prazo'], Object.values(PERGUNTA).map(p => {
      const it = item(p.id);
      return [p.n, esc(p.pergunta), st(p.id), esc(it.nota), esc(it.responsavel), dataBR(it.prazo)];
    }));
    $('#impressao').innerHTML = h;
    window.print();
  }

  function baixar(nome, tipo, conteudo) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
    a.download = nome;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }
  function csv() {
    // Valores que começam com =, +, - ou @ recebem um apóstrofo para não serem lidos como fórmula.
    const cel = v => { let s = String(v == null ? '' : v); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
    const linhas = [['Tipo', 'Item', 'Descrição', 'Tecnologia ou bloco', 'Pilar', 'Prioridade', 'Situação', 'Responsável', 'Prazo', 'Evidência e observações', 'Atualizado em (UTC)']];
    D.controles.forEach(c => { const it = item(c.id); linhas.push(['Controle', c.id, c.titulo, TEC[c.tecnologia].nome, c.pilar, c.prioridade, ROT[it.status], it.responsavel, dataBR(it.prazo), it.nota, it.atualizado_em]); });
    D.processos.blocos.forEach(b => b.perguntas.forEach(p => { const it = item(p.id); linhas.push(['Processo', 'Pergunta ' + p.n, p.pergunta, b.nome, '', '', ROT[it.status], it.responsavel, dataBR(it.prazo), it.nota, it.atualizado_em]); }));
    baixar('lateralshield-avaliacao-' + hoje() + '.csv', 'text/csv;charset=utf-8', '﻿' + linhas.map(l => l.map(cel).join(';')).join('\r\n') + '\r\n');
  }
  async function importar(arquivo) {
    let j;
    try { j = JSON.parse(await arquivo.text()); } catch (e) { alert('O arquivo não é um JSON válido.'); return; }
    if (!j || typeof j.itens !== 'object') { alert('O arquivo não parece uma exportação do Mission Control.'); return; }
    if (!confirm('Importar substitui todas as respostas atuais. Continuar?')) return;
    if (modo === 'servidor') {
      try {
        const r = await api('POST', 'importar', { meta: j.meta || {}, itens: j.itens });
        const e = await api('GET', 'estado');
        E.meta = e.meta || {}; E.itens = e.itens || {};
        marcar(true, r.importados + ' itens importados' + (r.ignorados ? ', ' + r.ignorados + ' ignorados' : ''));
      } catch (e) { alert('Não foi possível importar: ' + e.message); return; }
    } else {
      E.meta = j.meta || {}; E.itens = {};
      Object.keys(j.itens).forEach(id => { if (TIPO[id] && SITUACOES[TIPO[id]].includes(j.itens[id].status)) E.itens[id] = j.itens[id]; });
      marcar(gravarLocal(), Object.keys(E.itens).length + ' itens importados');
    }
    navegar();
  }

  // ---------------------------------------------------------------- senha
  function abrirSenha(obrigatoria) {
    trocaObrigatoria = obrigatoria;
    $('#pw-t').textContent = obrigatoria ? 'Defina uma nova senha' : 'Trocar a senha';
    $('#pw-d').textContent = obrigatoria
      ? 'Este é o primeiro acesso com a senha inicial. Antes de continuar, escolha uma senha com pelo menos ' + senhaMinima + ' caracteres.'
      : 'A nova senha precisa ter pelo menos ' + senhaMinima + ' caracteres.';
    $('#pw-cancelar').style.display = obrigatoria ? 'none' : '';
    $('#pw').reset();
    $('#pw-usuario').value = usuario;
    $('#pw-err').textContent = '';
    $('#veu').classList.add('on');
    $('#pw-atual').focus();
  }
  // Faz o navegador passar a usar a nova senha, sem pedir de novo ao usuário.
  function reautenticar(senha) {
    return new Promise(resolver => {
      const x = new XMLHttpRequest();
      x.open('GET', API + 'estado', true, usuario, senha);
      x.onloadend = () => resolver(x.status === 200);
      x.send();
    });
  }
  async function trocarSenha(ev) {
    ev.preventDefault();
    const atual = $('#pw-atual').value, nova = $('#pw-nova').value;
    if (nova !== $('#pw-rep').value) { $('#pw-err').textContent = 'As duas senhas novas são diferentes.'; return; }
    try {
      await api('POST', 'senha', { atual: atual, nova: nova });
    } catch (e) { $('#pw-err').textContent = e.message; return; }
    await reautenticar(nova);
    location.reload();
  }

  // ---------------------------------------------------------------- eventos
  document.addEventListener('click', ev => {
    const alvo = ev.target;
    const filtro = alvo.closest('[data-filtro]');
    if (filtro) { F[filtro.dataset.filtro] = filtro.dataset.valor; controles(); return; }
    const tec = alvo.closest('[data-tec]');
    if (tec) { F.tec = tec.dataset.tec; F.pilar = F.pri = F.st = F.q = ''; }
    const acao = alvo.closest('[data-acao]');
    if (acao) {
      const a = acao.dataset.acao;
      if (a === 'imprimir') imprimir();
      if (a === 'csv') csv();
      if (a === 'exportar') baixar('lateralshield-avaliacao-' + hoje() + '.json', 'application/json', JSON.stringify({ formato: 'lateralshield-mission-control', versao: 1, exportado_em: agoraUTC(), meta: E.meta, itens: E.itens }, null, 1));
      if (a === 'importar') $('#arquivo').click();
      if (a === 'senha') abrirSenha(false);
      if (a === 'apagar' && confirm('Apagar todas as respostas guardadas neste navegador?')) { E.meta = {}; E.itens = {}; marcar(gravarLocal(), 'Dados apagados'); navegar(); }
      return;
    }
    const cab = alvo.closest('.it .hd');
    if (cab && !alvo.closest('select')) {
      const id = cab.parentNode.dataset.id;
      if (abertos.has(id)) abertos.delete(id); else abertos.add(id);
      redesenharLinha(id);
    }
  });
  document.addEventListener('change', ev => {
    const alvo = ev.target;
    if (alvo.id === 'arquivo') { if (alvo.files[0]) importar(alvo.files[0]); alvo.value = ''; return; }
    if (alvo.dataset.meta) { salvarMeta(alvo.dataset.meta, alvo.value.trim()); return; }
    const linhaEl = alvo.closest('.it');
    if (alvo.dataset.campo && linhaEl) {
      const id = linhaEl.dataset.id, campo = alvo.dataset.campo;
      salvarItem(id, { [campo]: alvo.value.trim() }).then(() => atualizarLinha(id));
    }
  });
  document.addEventListener('input', ev => {
    if (ev.target.id === 'q') { F.q = ev.target.value; listaControles(); }
  });
  $('#pw').addEventListener('submit', trocarSenha);
  $('#pw-cancelar').addEventListener('click', () => $('#veu').classList.remove('on'));
  window.addEventListener('hashchange', navegar);

  // ---------------------------------------------------------------- início
  // A página veio de um servidor, mas a API falhou: não cai em modo local, para ninguém registrar respostas no lugar errado.
  function indisponivel(mensagem) {
    modo = 'servidor';
    $('#s-visao').classList.add('on');
    $('#s-visao').innerHTML = cabecalho('Mission Control', 'Servidor <em>indisponível</em>', esc(mensagem) + ' Recarregue a página em instantes. Nada foi alterado.');
  }
  async function iniciar() {
    if (location.protocol !== 'file:') {
      try {
        const r = await fetch(API + 'estado', { headers: { Accept: 'application/json' }, credentials: 'same-origin' });
        if ((r.headers.get('content-type') || '').includes('json')) {
          const j = await r.json();
          if (!r.ok) { indisponivel(j.mensagem || ('Erro ' + r.status)); return; }
          modo = 'servidor'; usuario = j.usuario; senhaMinima = j.senha_minima || senhaMinima;
          if (j.deve_trocar) { menu(); rodape(); abrirSenha(true); return; }
          E.meta = j.meta || {}; E.itens = j.itens || {};
        }
        // Qualquer outra resposta (um 404 de servidor de arquivos, por exemplo): não há API, segue em modo local.
      } catch (e) { indisponivel('Não foi possível falar com o servidor.'); return; }
    }
    if (modo === 'local') carregarLocal();
    rodape();
    navegar();
  }
  iniciar();
})();
</script>
</body>
</html>
